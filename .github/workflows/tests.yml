name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: optional extras the tests cover (room eye pictures)
        run: pip install numpy pillow
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: render every page against the demo family
        run: |
          python tools/demo.py --seed-only /tmp/ct-demo
          CHORE_DATA=/tmp/ct-demo CHORE_DEMO=1 python server.py &
          sleep 3
          node tools/smoke.js
