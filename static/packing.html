    h+='<div class="notice stagecard"><div><b>Current stage: '+esc(stageNames[phase])+'</b><span class="muted">'+esc(stageLead[phase])+counts[phase]+' of '+totals[phase]+' marked · one tap completes only this stage and opens '+esc(nextNames[phase])+'.</span>'+(backStage[phase]?'<div><button data-stage="'+backStage[phase]+'" style="margin-top:8px">Go back one stage</button></div>':'')+'</div><button class="primary" data-complete-stage="1">'+esc(stageButtons[phase])+'</button></div>'}
  (p.piles||[]).forEach(function(g){
    var list=(g.items||[]).filter(function(x){return(!x.only||x.only.indexOf(id)>=0)&&(!areaList.length||areaOf(p,r,x)===areaId)});
    if(!list.length)return;
    var
      ready=list.filter(function(x){return r&&((r.ready||{})[x.id]||(r.checked||{})[x.id]==="pass")}).length,
      checked=list.filter(function(x){return r&&(r.checked||{})[x.id]==="pass"}).length,
      packed=list.filter(function(x){return r&&(r.packed||{})[x.id]}).length,
      n=ready+checked+packed,pct=list.length?Math.round(100*n/(list.length*3)):100,
      phase=(r&&r.phase)||"layout",
      label=phase==="layout"?ready+" / "+list.length+" laid out":phase==="inspect"?checked+" / "+list.length+" inspected":packed+" / "+list.length+" in bags";
    h+='<details class="category" open><summary class="cathead"><div style="font-size:26px">🧳</div><h2>'+esc(g.title)+'</h2><b>'+label+'</b><span class="fold">⌄</span></summary>'+
      '<div class="cattools"><span class="muted">'+esc(g.note||"")+'</span>'+(canEdit?'<button data-add="'+esc(g.id)+'">＋ Add item</button><details><summary>List options</summary><div class="actions"><button data-cedit="'+esc(g.id)+'">Rename</button><button class="danger" data-cdel="'+esc(g.id)+'">Remove category</button></div></details>':'')+'</div>'+
      '<div class="bar"><i style="width:'+pct+'%"></i></div><div class="items">'+(function(){var groupDefs={};(g.groups||[]).forEach(function(z){if(z&&z.id)groupDefs[z.id]=z});var seen={};function itemHtml(x){
        var st=status(r,x),open=OPEN_ITEM===g.id+":"+x.id,done=st==="packed"||st==="inspected";
        var controls='';
        if(canInspect)controls+='<button class="primary" data-present="'+esc(x.id)+'">✓ Present</button><button class="danger" data-missing="'+esc(x.id)+'">Missing</button>';
        if(canPack)controls+='<button class="primary" data-pack="'+esc(x.id)+'" data-pile="'+esc(g.id)+'">'+(st==='packed'?'Take back out':'✓ In bag')+'</button>';
        if(canPack&&areaList.length){var other=areaList.find(function(a){return a.id!==areaId});if(other)controls+='<button data-move-area="'+esc(other.id)+'" data-item="'+esc(x.id)+'">'+(other.id==='downstairs'?'Actually downstairs':'Move upstairs')+'</button>'}
        if(canEdit)controls+=moveChoices(p,g,x)+'<button data-iedit="'+esc(x.id)+'" data-pile="'+esc(g.id)+'">Edit item</button><button class="danger" data-idel="'+esc(x.id)+'" data-pile="'+esc(g.id)+'">Remove</button>';
        return'<div class="item '+(done?'done ':'')+(st==='packed'?'packed':'')+'"><button class="itemsummary" data-openitem="'+esc(g.id+":"+x.id)+'"><span>'+esc(x.name)+'</span><span class="chev">'+(open?'⌃':'›')+'</span></button>'+(open?'<div class="itemdetail"><div class="state">'+esc(st)+(x.note?' · '+esc(x.note):'')+'</div><div class="actions">'+controls+'</div></div>':'')+'</div>'}
        return list.map(function(x){var def=groupDefs[x.group];if(!def)return itemHtml(x);if(seen[x.group])return"";seen[x.group]=true;var members=list.filter(function(y){return y.group===x.group}),inBag=members.filter(function(y){return r&&(r.packed||{})[y.id]}).length,open=members.some(function(y){return OPEN_ITEM===g.id+":"+y.id});return'<details class="subgroup" '+(open?'open':'')+'><summary class="subhead"><span style="font-size:22px">'+esc(def.emoji||"👜")+'</span><strong>'+esc(def.title||x.group)+'</strong><span>'+inBag+' / '+members.length+' in bag</span><span class="fold">⌄</span></summary>'+(def.note?'<div class="muted" style="padding:0 13px 10px">'+esc(def.note)+'</div>':'')+'<div class="items">'+members.map(itemHtml).join("")+'</div></details>'}).join("")})()+'</div></details>'
  });
  if(p.final_checks&&p.final_checks.length&&(!areaList.length||areaId===(areaList[areaList.length-1]||{}).id)){h+='<section class="category finals"><h2>Final checks</h2><div class="items">'+p.final_checks.map(function(x){
    var pass=r&&(r.finals||{})[x.id]==="pass",open=OPEN_ITEM==="final:"+x.id,controls='',gate=finalWindow(x);
    if(canInspect&&r&&r.phase==="final")controls='<button class="primary" data-final-present="'+esc(x.id)+'">✓ Pass</button><button class="danger" data-final-missing="'+esc(x.id)+'">Needs a fix</button>';
    if(canPack)controls='<button class="primary" data-final="'+esc(x.id)+'" '+(!pass&&!gate.ok?'disabled':'')+'>'+(pass?'Undo final check':'Mark checked')+'</button>';
    return'<div class="item '+(pass?'done packed':'')+'"><button class="itemsummary" data-openitem="final:'+esc(x.id)+'"><span>'+esc(x.name)+'</span><span class="chev">'+(open?'⌃':'›')+'</span></button>'+(open?'<div class="itemdetail"><div class="state">'+esc(gate.text)+'</div>'+(controls?'<div class="actions">'+controls+'</div>':'')+'</div>':'')+'</div>'
  }).join("")+'</div></section>'}
  if(adult)h+=departureSections()+'<div class="notice">This grown-up checklist never creates a star balance or awards kid points.</div>';$("main").innerHTML=h;wire(id,p,r)}
function wire(id,p,r){if($("addcat"))$("addcat").onclick=function(){var title=prompt("Category name");if(title)edit({action:"add_category",profile:p.id,title:title})};
  document.querySelectorAll("[data-move-item]").forEach(function(n){n.onchange=function(){if(!n.value)return;var dest;try{dest=JSON.parse(n.value)}catch(e){toast("That destination is unavailable",true);return}n.disabled=true;movePackingItem(p,n.dataset.fromPile,n.dataset.moveItem,dest)}});
  document.querySelectorAll("[data-departure-task]").forEach(function(n){n.onclick=function(){var on=n.dataset.departureDone==="true";n.disabled=true;n.textContent="Saving…";saveDepartureTask(n.dataset.departureTask,on)}});
  document.querySelectorAll("[data-area]").forEach(function(n){n.onclick=function(){PACK_AREA[id]=n.dataset.area;OPEN_ITEM=null;renderPerson(id)}});
  document.querySelectorAll("[data-move-area]").forEach(function(n){n.onclick=function(){n.disabled=true;n.textContent="Saving…";var q=JSON.parse(JSON.stringify(r||fresh(p,id)));q.locations=q.locations||{};q.locations[n.dataset.item]=n.dataset.moveArea;saveItemAction(id,q,{item:n.dataset.item,area:n.dataset.moveArea})}});
  document.querySelectorAll("[data-openitem]").forEach(function(n){n.onclick=function(){OPEN_ITEM=OPEN_ITEM===n.dataset.openitem?null:n.dataset.openitem;renderPerson(id)}});
  document.querySelectorAll("[data-stage]").forEach(function(n){n.onclick=function(){n.disabled=true;n.textContent="Saving…";stageProgress(id,n.dataset.stage)}});
  document.querySelectorAll("[data-complete-stage]").forEach(function(n){n.onclick=function(){n.disabled=true;n.textContent="Saving…";stageProgress(id,"complete_stage")}});
  document.querySelectorAll("[data-pack]").forEach(function(n){n.onclick=function(){n.disabled=true;n.textContent="Saving…";var q=JSON.parse(JSON.stringify(r||fresh(p,id))),on=!(q.packed||{})[n.dataset.pack];q.ready=q.ready||{};q.checked=q.checked||{};q.packed=q.packed||{};if(on){q.ready[n.dataset.pack]=true;q.checked[n.dataset.pack]="pass";q.packed[n.dataset.pack]=true}else{delete q.packed[n.dataset.pack];delete q.checked[n.dataset.pack];delete q.ready[n.dataset.pack]}finishPhase(p,id,q);saveItemAction(id,q,{item:n.dataset.pack,packed:on})}});
  document.querySelectorAll("[data-present]").forEach(function(n){n.onclick=function(){n.disabled=true;n.textContent="Saving…";markProgress(id,n.dataset.present,"present")}});
  document.querySelectorAll("[data-missing]").forEach(function(n){n.onclick=function(){n.disabled=true;n.textContent="Saving…";markProgress(id,n.dataset.missing,"missing")}});
  document.querySelectorAll("[data-final]").forEach(function(n){n.onclick=function(){var q=JSON.parse(JSON.stringify(r||fresh(p,id)));q.finals=q.finals||{};if(q.finals[n.dataset.final]==="pass")delete q.finals[n.dataset.final];else q.finals[n.dataset.final]="pass";finishPhase(p,id,q);saveProgress(id,q)}});
  document.querySelectorAll("[data-final-present]").forEach(function(n){n.onclick=function(){var q=JSON.parse(JSON.stringify(r||fresh(p,id)));q.finals=q.finals||{};q.finals[n.dataset.finalPresent]="pass";var done=(p.final_checks||[]).every(function(x){return q.finals[x.id]==="pass"})&&items(p,id).every(function(x){return(q.packed||{})[x.id]});q.phase=done?"complete":"final";saveProgress(id,q)}});
  document.querySelectorAll("[data-final-missing]").forEach(function(n){n.onclick=function(){var q=JSON.parse(JSON.stringify(r||fresh(p,id)));q.finals=q.finals||{};q.finals[n.dataset.finalMissing]="fix";q.phase="pack";saveProgress(id,q)}});
  document.querySelectorAll("[data-add]").forEach(function(n){n.onclick=function(){var name=prompt("Item name for "+person(id).name);if(name)edit({action:"add_item",profile:p.id,pile:n.dataset.add,name:name,only:(p.kids||[]).indexOf(id)>=0?id:null})}});
  document.querySelectorAll("[data-cedit]").forEach(function(n){n.onclick=function(){var g=(p.piles||[]).find(function(x){return x.id===n.dataset.cedit}),title=prompt("Category name",g.title);if(title!==null)edit({action:"edit_category",profile:p.id,pile:g.id,title:title,icon:g.icon||"",note:prompt("Category note",g.note||"")||""})}});
  document.querySelectorAll("[data-cdel]").forEach(function(n){n.onclick=function(){if(confirm("Remove this category and all its items?"))edit({action:"remove_category",profile:p.id,pile:n.dataset.cdel})}});
  document.querySelectorAll("[data-iedit]").forEach(function(n){n.onclick=function(){var g=(p.piles||[]).find(function(x){return x.id===n.dataset.pile}),x=(g.items||[]).find(function(y){return y.id===n.dataset.iedit}),name=prompt("Item name",x.name);if(name!==null)edit({action:"edit_item",profile:p.id,pile:g.id,item:x.id,name:name,icon:x.icon||"",note:prompt("Item note",x.note||"")||""})}});
  document.querySelectorAll("[data-idel]").forEach(function(n){n.onclick=function(){if(confirm("Remove this item?"))edit({action:"remove_item",profile:p.id,pile:n.dataset.pile,item:n.dataset.idel})}})}
function finishPhase(p,id,r){var all=items(p,id),packed=all.every(function(x){return(r.packed||{})[x.id]}),finals=(p.final_checks||[]).every(function(x){return(r.finals||{})[x.id]==="pass"});r.phase=packed&&finals?"complete":"pack"}
function load(){api("/api/state").then(function(s){if(!s){toast("Packing state is unavailable",true);return}S=adoptState(s);render()})}
$("reload").onclick=load;load();setInterval(function(){if(HA_MODE){var s=haState();if(s){S=adoptState(s);render()}}},30000);
</script></body></html>
