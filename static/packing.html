<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Family packing</title>
<style>
:root{--bg:#f4f3eb;--card:#fffef8;--ink:#243d40;--mute:#667b78;--line:#dce3db;--acc:#326f69;--soft:#e5ebe2}
@media(prefers-color-scheme:dark){:root{--bg:#111c22;--card:#1b2a30;--ink:#dce7e4;--mute:#a2b5b0;--line:#35484c;--acc:#457b6f;--soft:#263a3e}}
*{box-sizing:border-box}body{margin:0 auto;max-width:1120px;padding:24px clamp(14px,4vw,48px) 70px;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
a,button{font:inherit}a{color:var(--acc)}button{border:0;border-radius:16px;background:var(--soft);color:var(--ink);padding:8px 13px;cursor:pointer}button.primary{background:var(--acc);color:#fff}button.danger{color:#a33;background:transparent;border:1px solid currentColor}button:disabled{opacity:.45}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.top h1{font-size:clamp(27px,4vw,42px);font-weight:550;margin:0;flex:1}.sub{color:var(--mute);margin:5px 0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button.on{background:var(--acc);color:#fff}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:14px 0 24px}.person,.category{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px}.person.on{outline:3px solid var(--acc)}.name{display:flex;justify-content:space-between;gap:8px;font-size:17px;font-weight:700}.muted{color:var(--mute);font-size:13px}.bar{height:9px;background:var(--soft);border-radius:8px;overflow:hidden;margin:8px 0}.bar>i{display:block;height:100%;background:var(--acc);border-radius:8px}.category{margin:12px 0}.cathead{display:flex;align-items:center;gap:9px}.cathead h2{flex:1;font-size:20px;margin:0}.actions{display:flex;gap:7px;flex-wrap:wrap}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:7px;margin-top:12px}.item{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:13px;padding:10px;background:var(--bg)}.item.packed{background:#e4f3e7}.item .copy{flex:1;min-width:0}.item b{display:block}.item .state{font-size:12px;color:var(--mute)}.tick{font-size:23px;min-width:42px}.empty{text-align:center;color:var(--mute);padding:30px}.finals{border-top:1px solid var(--line);margin-top:16px;padding-top:13px}.notice{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin:10px 0}.error{color:#a33}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#17211f;color:#fff;padding:10px 16px;border-radius:12px;display:none}
</style></head><body>
<div class="top"><a id="back" href="/inspect">← Chores</a><h1>🧳 Family packing</h1><button id="reload">Refresh</button></div>
<div class="sub" id="subtitle">One reusable place for every packer and every trip.</div>
<div id="auth" class="notice" style="display:none"></div>
<div id="overview" class="overview"></div><div id="tabs" class="tabs"></div><main id="main"></main>
<div id="toast"></div>
<script>
function $(id){return document.getElementById(id)}
function esc(t){return String(t==null?"":t).replace(/[&<>\"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var S=null,me=null,selected=null,HA_MODE=location.pathname.indexOf("/local/")===0;
function hass(){try{return typeof window.parent.hass==="function"?window.parent.hass():window.parent.document.querySelector("home-assistant").hass}catch(e){return null}}
function entityPayload(states,id){var st=states&&states[id],m=st&&st.attributes;if(!m)return null;if(!m.chunked)return JSON.parse(JSON.stringify(m));var parts=[];for(var i=1;i<=Number(m.parts);i++){var a=states[id+"_part_"+i]&&states[id+"_part_"+i].attributes;if(!a||a.revision!==m.revision)return null;parts.push(a.payload)}try{return JSON.parse(parts.join(""))}catch(e){return null}}
function haState(){var h=hass(),a=h&&entityPayload(h.states,"sensor.chore_state");if(a)a.now=Date.now()/1000;return a}
function api(path,body){return fetch(path,{method:body?"POST":"GET",headers:{"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined}).then(function(r){return r.json()})}
if(HA_MODE){
  $("back").href="/local/chore-inspect.html";$("back").onclick=function(e){if(typeof window.parent.closePackingWorkspace==="function"){e.preventDefault();window.parent.closePackingWorkspace()}};
  api=function(path,body){
    if(!body)return Promise.resolve(haState());
    var n=Math.random().toString(36).slice(2,9),msg=Object.assign({a:path.replace("/api/",""),n:n},body),v=JSON.stringify(msg);
    function send(val,nonce){return hass().callService("input_text","set_value",{entity_id:"input_text.chore_action",value:val}).then(function(){return new Promise(function(resolve){var t=0;(function wait(){var a=hass().states["sensor.chore_state"]&&hass().states["sensor.chore_state"].attributes;if(a&&a.last_result&&a.last_result.n===nonce)return resolve({ok:a.last_result.ok,error:a.last_result.error,state:haState()});if(++t>60)return resolve({ok:false,error:"no answer from chore app"});setTimeout(wait,250)})()})})}
    if(v.length<=255)return send(v,n);
    var chunks=[],rest=v;while(rest.length){chunks.push(rest.slice(0,180));rest=rest.slice(180)}var chain=Promise.resolve({ok:true});chunks.forEach(function(d,i){chain=chain.then(function(r){if(!r.ok)return r;var nn=i===chunks.length-1?n:n+"p"+i;return send(JSON.stringify({a:"_part",n:nn,id:n,i:i,of:chunks.length,d:d}),nn)})});return chain;
  };
  try{var h=hass(),nm=(h.user.name||"").toLowerCase(),I=(haState().config.inspectors||[]),hit=I.find(function(x){return nm.indexOf(String(x.name).toLowerCase())>=0||nm.indexOf(x.id)>=0});if(hit)me=hit.id}catch(e){}
}else{me=(location.search.match(/[?&]by=([a-z0-9_-]+)/)||[])[1]||null}
function person(id){return (S.config.kids||[]).concat(S.config.inspectors||[]).find(function(x){return x.id===id})||{id:id,name:id,icon:"1f9f3",color:"#326f69"}}
function packers(p){var out=(p.kids||[]).slice();(p.packers||[]).forEach(function(x){x=typeof x==="object"?x.id:x;if(x&&out.indexOf(x)<0)out.push(x)});return out}
function profile(id){return (S.packing_game.profiles||[]).find(function(p){return packers(p).indexOf(id)>=0})}
function items(p,id){var out=[];(p.piles||[]).forEach(function(g){(g.items||[]).forEach(function(x){if(!x.only||x.only.indexOf(id)>=0)out.push(x)})});return out}
function status(r,x){if(!r)return"not started";if((r.packed||{})[x.id])return"packed";if((r.checked||{})[x.id]==="pass")return"inspected";if((r.ready||{})[x.id])return"laid out";if((r.checked||{})[x.id]==="fix")return"needs a fix";return"not laid out"}
function percent(id,p,r){var all=items(p,id);return all.length?Math.round(all.filter(function(x){return r&&(r.packed||{})[x.id]}).length*100/all.length):100}
function since(ts){if(!ts)return"No physical packing interaction yet";var s=Math.max(0,(S.now||Date.now()/1000)-ts);if(s<90)return"Packing just now";if(s<5400)return"Last packed "+Math.round(s/60)+" min ago";if(s<129600)return"Last packed "+Math.round(s/3600)+" h ago";return"Last packed "+Math.round(s/86400)+" d ago"}
function fresh(p,id){return{version:S.packing_game.version,profile:p.id,packer:id,seq:Date.now(),phase:"pack",ready:{},checked:{},packed:{},finals:{}}}
function saveAdult(id,r){r.seq=Math.max(+r.seq+1||1,Date.now());return api("/api/packing_update",{packer:id,by:me,progress:r}).then(done)}
function done(r){if(!r||!r.ok){toast((r&&r.error)||"Packing change failed",true);return}if(r.state)S=r.state;toast("Saved");render()}
function toast(t,bad){var n=$("toast");n.textContent=t;n.className=bad?"error":"";n.style.display="block";setTimeout(function(){n.style.display="none"},2500)}
function edit(body){body.by=me;return api("/api/packing_admin",body).then(done)}
function render(){var c=S&&S.packing_game;if(!c||!c.activated){$("main").innerHTML='<div class="empty">No packing trip is active.</div>';return}$("subtitle").textContent=c.title+(c.subtitle?" · "+c.subtitle:"");var ids=[];(c.profiles||[]).forEach(function(p){packers(p).forEach(function(id){if(ids.indexOf(id)<0)ids.push(id)})});if(!selected||ids.indexOf(selected)<0)selected=ids[0];
  $("auth").style.display=me?"none":"block";$("auth").textContent="Open this page from the signed-in Home Assistant Chore dashboard to edit lists or check grown-up items.";
  $("overview").innerHTML=ids.map(function(id){var p=profile(id),r=(c.progress||{})[id],pct=percent(id,p,r),who=person(id);return'<div class="person '+(id===selected?'on':'')+'" data-person="'+esc(id)+'"><div class="name"><span>'+esc(who.name)+'</span><span>'+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="muted">'+esc(since(r&&r.interacted_at))+'</div></div>'}).join("");
  $("tabs").innerHTML=ids.map(function(id){return'<button class="'+(id===selected?'on':'')+'" data-tab="'+esc(id)+'">'+esc(person(id).name)+'</button>'}).join("");
  document.querySelectorAll("[data-person],[data-tab]").forEach(function(n){n.onclick=function(){selected=n.dataset.person||n.dataset.tab;render()}});renderPerson(selected)}
function renderPerson(id){var c=S.packing_game,p=profile(id),r=(c.progress||{})[id]||null,who=person(id),adult=(p.kids||[]).indexOf(id)<0,canPack=adult&&me===id,canEdit=!!me,h='<div class="top"><h1 style="font-size:28px">'+esc(who.name)+' · '+esc(p.name||"packing list")+'</h1>'+(canEdit?'<button class="primary" id="addcat">＋ Category</button>':'')+'</div>';
  (p.piles||[]).forEach(function(g){var list=(g.items||[]).filter(function(x){return!x.only||x.only.indexOf(id)>=0}),packed=list.filter(function(x){return r&&(r.packed||{})[x.id]}).length,pct=list.length?Math.round(100*packed/list.length):100;h+='<section class="category"><div class="cathead"><div style="font-size:26px">🧳</div><h2>'+esc(g.title)+'</h2><b>'+packed+' / '+list.length+'</b>'+(canEdit?'<div class="actions"><button data-add="'+esc(g.id)+'">＋ Item</button><button data-cedit="'+esc(g.id)+'">Edit</button><button class="danger" data-cdel="'+esc(g.id)+'">Remove</button></div>':'')+'</div><div class="muted">'+esc(g.note||"")+'</div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="items">'+list.map(function(x){var st=status(r,x);return'<div class="item '+(st==='packed'?'packed':'')+'"><button class="tick" data-pack="'+esc(x.id)+'" data-pile="'+esc(g.id)+'" '+(!canPack||r&&r.complete?'disabled':'')+'>'+(st==='packed'?'✓':'○')+'</button><div class="copy"><b>'+esc(x.name)+'</b><span class="state">'+esc(st)+(x.note?' · '+esc(x.note):'')+'</span></div>'+(canEdit?'<div class="actions"><button data-iedit="'+esc(x.id)+'" data-pile="'+esc(g.id)+'">Edit</button><button class="danger" data-idel="'+esc(x.id)+'" data-pile="'+esc(g.id)+'">×</button></div>':'')+'</div>'}).join("")+'</div></section>'});
  if(p.final_checks&&p.final_checks.length){h+='<section class="category finals"><h2>Final checks</h2><div class="items">'+p.final_checks.map(function(x){var pass=r&&(r.finals||{})[x.id]==="pass";return'<div class="item '+(pass?'packed':'')+'"><button class="tick" data-final="'+esc(x.id)+'" '+(!canPack||r&&r.complete?'disabled':'')+'>'+(pass?'✓':'○')+'</button><div class="copy"><b>'+esc(x.name)+'</b><span class="state">'+esc(x.note||"Final grown-up check")+'</span></div></div>'}).join("")+'</div></section>'}
  if(adult)h+='<div class="notice">This grown-up checklist never creates a star balance or awards kid points.</div>';$("main").innerHTML=h;wire(id,p,r)}
function wire(id,p,r){if($("addcat"))$("addcat").onclick=function(){var title=prompt("Category name");if(title)edit({action:"add_category",profile:p.id,title:title})};
  document.querySelectorAll("[data-pack]").forEach(function(n){n.onclick=function(){var q=JSON.parse(JSON.stringify(r||fresh(p,id))),on=!(q.packed||{})[n.dataset.pack];q.ready=q.ready||{};q.checked=q.checked||{};q.packed=q.packed||{};if(on){q.ready[n.dataset.pack]=true;q.checked[n.dataset.pack]="pass";q.packed[n.dataset.pack]=true}else{delete q.packed[n.dataset.pack];delete q.checked[n.dataset.pack];delete q.ready[n.dataset.pack]}finishPhase(p,id,q);saveAdult(id,q)}});
  document.querySelectorAll("[data-final]").forEach(function(n){n.onclick=function(){var q=JSON.parse(JSON.stringify(r||fresh(p,id)));q.finals=q.finals||{};if(q.finals[n.dataset.final]==="pass")delete q.finals[n.dataset.final];else q.finals[n.dataset.final]="pass";finishPhase(p,id,q);saveAdult(id,q)}});
  document.querySelectorAll("[data-add]").forEach(function(n){n.onclick=function(){var name=prompt("Item name");if(name)edit({action:"add_item",profile:p.id,pile:n.dataset.add,name:name})}});
  document.querySelectorAll("[data-cedit]").forEach(function(n){n.onclick=function(){var g=(p.piles||[]).find(function(x){return x.id===n.dataset.cedit}),title=prompt("Category name",g.title);if(title!==null)edit({action:"edit_category",profile:p.id,pile:g.id,title:title,icon:g.icon||"",note:prompt("Category note",g.note||"")||""})}});
  document.querySelectorAll("[data-cdel]").forEach(function(n){n.onclick=function(){if(confirm("Remove this category and all its items?"))edit({action:"remove_category",profile:p.id,pile:n.dataset.cdel})}});
  document.querySelectorAll("[data-iedit]").forEach(function(n){n.onclick=function(){var g=(p.piles||[]).find(function(x){return x.id===n.dataset.pile}),x=(g.items||[]).find(function(y){return y.id===n.dataset.iedit}),name=prompt("Item name",x.name);if(name!==null)edit({action:"edit_item",profile:p.id,pile:g.id,item:x.id,name:name,icon:x.icon||"",note:prompt("Item note",x.note||"")||""})}});
  document.querySelectorAll("[data-idel]").forEach(function(n){n.onclick=function(){if(confirm("Remove this item?"))edit({action:"remove_item",profile:p.id,pile:n.dataset.pile,item:n.dataset.idel})}})}
function finishPhase(p,id,r){var all=items(p,id),packed=all.every(function(x){return(r.packed||{})[x.id]}),finals=(p.final_checks||[]).every(function(x){return(r.finals||{})[x.id]==="pass"});r.phase=packed&&finals?"complete":"pack"}
function load(){api("/api/state").then(function(s){if(!s){toast("Packing state is unavailable",true);return}S=s;render()})}
$("reload").onclick=load;load();setInterval(function(){if(HA_MODE){var s=haState();if(s){S=s;render()}}},30000);
</script></body></html>
