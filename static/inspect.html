<style>

.who{display:flex;gap:8px;margin-left:auto}

.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line)}
.tag.warn{background:#ffebee;color:#c62828}.tag.bonus{background:#ffedd5;color:#9a3412}.tag.clean{background:#dcfce7;color:#166534}.tag.pend{background:#dbeafe;color:#1e40af}
.big2{font-size:22px;padding:10px 16px}

.tvgo{width:100%;font-size:22px;font-weight:800;padding:14px;margin-top:10px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 8px}.ttl{font-size:20px}
.chip{border-radius:999px;padding:6px 12px;font-weight:700}
.h2b{color:var(--ink);font-size:18px;text-transform:none;letter-spacing:0;margin:14px 0 6px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:8px 0}
summary{font-weight:700;cursor:pointer;padding:4px 0}

.tgl .sw{width:46px;height:26px;border-radius:13px;background:#bbb;position:relative;flex:none;transition:background .2s}
.tgl .sw span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.tgl.on .sw{background:var(--acc,#43a047)}.tgl.on .sw span{left:23px}.tgl.on{border-color:var(--acc,#43a047)}
.cfl{display:block;margin:10px 0 3px;font-weight:600}.cfl .mute{font-weight:400}
.cfi{width:100%;box-sizing:border-box;padding:8px 10px;font-size:15px}
.cfrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.cfrow>div{flex:1;min-width:120px}
.cfck{display:inline-flex;align-items:center;gap:6px;padding:6px 0;margin-right:10px}.cfck .e{width:20px;height:20px}
.cfmore{margin-top:12px}.cfmore summary{cursor:pointer;color:var(--mute)}
.pmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:16px}
.pmodal.on{display:flex}.pbox{background:var(--bg);border-radius:18px;padding:16px;width:100%;max-width:640px;position:relative;margin-top:20px}
.px{position:absolute;top:6px;right:10px;font-size:34px;cursor:pointer;line-height:1}
details.cgrp{margin:6px 0;padding:4px 10px}
.pbar{position:relative;height:22px;background:#e9ecef;border-radius:12px;margin:34px 6px 22px;min-width:200px}
.pbar.big{height:34px;margin:36px 8px 24px;flex:1}
.pbar .pf{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:12px;background:linear-gradient(90deg,#ffd54a,#43a047)}
.pbar.over .pf{background:#ff9800}
.pbar .pm{position:absolute;top:-30px;transform:translateX(-50%);font-size:20px;white-space:nowrap;text-align:center;line-height:1}
.pbar .pm span{display:block;font-size:12px;font-weight:800;color:#555}
.pbar .pm::after{content:"";position:absolute;left:50%;top:26px;width:2px;height:26px;background:rgba(0,0,0,.3)}
.pbar.big .pm::after{height:38px}
.pbar .pm.pb{top:auto;bottom:-34px}.pbar .pm.pb::after{top:auto;bottom:22px}
.pbar .pr{position:absolute;top:-4px;font-size:26px;transform:translateX(-50%);left:0}
.pbar.big .pr{font-size:36px;top:-6px}
.empty{color:var(--mute);text-align:center;padding:16px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s}
#toast.on{opacity:.92}

  document.querySelectorAll("[data-pzk]").forEach(function(b){b.onclick=function(){var z=PZ[b.dataset.pzk];post("/api/keep",{kid:b.dataset.pzk,chore:z.chore,until:Math.max(z.until,Date.now()/1000)+7*86400},"Kept 7 more days")}});
  document.querySelectorAll("[data-pzp]").forEach(function(b){b.onclick=function(){var k=b.dataset.pzp,z=PZ[k],v=prompt("Partial points for "+kidOf(k).name+" ("+choreOf(z.chore).name+")?","1");if(!v)return;
    post("/api/adjust",{kid:k,points:+v,reason:"partly did "+choreOf(z.chore).name},"+"+v+" for "+kidOf(k).name)}});
  // chart
  var ch="";S.config.chores.forEach(function(c){if(c.hidden)return;var bd=S.board[c.id]||{},odBusy=(bd.pending_by||[]).length||Object.values(S.active||{}).concat(Object.values(S.paused||{})).some(function(a){return a.chore===c.id});var tags=c.bundle?'<span class="tag">'+(c.only?c.only.join(", ")+' only · ':'')+'now '+(bd.price||0)+' pts = '+((bd.covers||[]).map(function(x){var cc=S.config.chores.find(function(y){return y.id===x})||{name:x};return esc(cc.name)+' '+((S.board[x]||{}).price||0)}).join(' + ')||'all tidy')+(bd.boost_pct?' +'+bd.boost_pct+'% big-job bonus ('+bd.boost_from+'→'+bd.price+')':'')+'</span> ':"";
    if(bd.bonus)tags+='<span class="tag bonus">next time: '+(bd.price==null?"?":bd.price)+'</span> ';
    if(bd.note)tags+='<span class="tag">📝 '+esc(bd.note).replace(/\n/g," · ")+'</span> ';
    if(bd.clean_until)tags+='<span class="tag clean">tidy until '+new Date(bd.clean_until*1000).toLocaleString([], {weekday:"short",hour:"numeric"})+'</span> ';
    if(bd.pending_by&&bd.pending_by.length)tags+='<span class="tag pend">waiting</span> ';
    if(c.on_demand)tags+='<span class="tag '+(bd.opened||odBusy?'clean':'')+'">'+(odBusy?'active · kid working or waiting':bd.opened?'active for kids':'inactive · parent marks active when laundry is ready')+'</span> ';
    var T=(S.typical||{})[c.id];if(T)tags+='<span class="tag">⏱ ~'+Math.round(T.minutes)+' min ('+T.n+')</span> ';
    ch+='<div class="card chore" data-c="'+c.id+'"><span class="big">'+E(c.icon)+'</span><span class="nm">'+esc(c.name)+' <span class="mute">'+(c.points==null?"adult sets":c.points+" pts")+(c.room?" · room":"")+'</span><br>'+tags+'</span>'+
      '<button data-a="price">Price once</button>'+(c.on_demand&&!odBusy?'<button data-a="od" data-on="'+(bd.opened?1:0)+'">'+(bd.opened?'Mark inactive':'Mark active')+'</button>':'')+(c.room&&!c.bundle?'<button data-a="tidy" title="Record tidy now; no points; vacuum history stays separate">✨ Mark tidy</button>':'')+(bd.clean_until?'<button data-a="reopen">Reopen</button>':'')+'<button data-a="edit">Edit</button></div>'});
  // group into collapsible floors (open/closed state remembered while the page is open)
  var groups={Downstairs:[],Upstairs:[],Other:[]};
  ch.split('<div class="card chore" data-c="').slice(1).forEach(function(part){var id=part.slice(0,part.indexOf('"')),c=choreOf(id);
    (groups[c.floor||"Other"]||groups.Other).push('<div class="card chore" data-c="'+part)});
  window.CHOPEN=window.CHOPEN||{};
  $("chart").innerHTML=["Downstairs","Upstairs","Other"].filter(function(g){return groups[g].length}).map(function(g){
    return '<details class="cgrp" data-g="'+g+'"'+(CHOPEN[g]?" open":"")+'><summary>'+({Downstairs:"⬇️",Upstairs:"⬆️",Other:"✨"}[g])+' '+g+' <span class="mute">('+groups[g].length+')</span></summary>'+groups[g].join("")+'</details>'}).join("");
  var spaces=Object.values(S.tidy_spaces||{}).filter(function(x){return !(x.chores||[]).length});
  if(spaces.length){var html='<details class="cgrp" data-g="Room condition"'+(CHOPEN['Room condition']?' open':'')+'><summary>Room condition · no children’s jobs or points</summary>';
    spaces.forEach(function(x){var label={tidy:'Tidy',untidy:'Untidy',unknown:'Not checked'}[x.state]||x.state;html+='<div class="card row"><span style="flex:1"><b>'+esc(x.name)+'</b><br><small>'+label+'</small></span><button data-space="'+esc(x.id)+'" data-tidy="true">✨ Mark tidy</button><button data-space="'+esc(x.id)+'" data-tidy="false">🧹 Mark untidy</button></div>'});
    $("chart").insertAdjacentHTML('beforeend',html+'</details>');
    document.querySelectorAll('[data-space]').forEach(function(b){b.onclick=function(){b.disabled=true;post('/api/space_tidy',{space:b.dataset.space,tidy:b.dataset.tidy==='true'},'Room marked '+(b.dataset.tidy==='true'?'tidy':'untidy')).finally(function(){b.disabled=false})}});
  }
  document.querySelectorAll("#chart details.cgrp").forEach(function(d){d.ontoggle=function(){CHOPEN[d.dataset.g]=d.open}});
  document.querySelectorAll("#chart .chore").forEach(function(n){var c=choreOf(n.dataset.c);
    n.querySelector('[data-a="price"]').onclick=function(){NOTEFORM={chore:c.id,mode:"price"};openPM("noteform")};
    var tidy=n.querySelector('[data-a="tidy"]');if(tidy){var busy=Object.values(S.active||{}).concat(Object.values(S.paused||{})).some(function(a){return a.chore===c.id})||((S.board[c.id]||{}).pending_by||[]).length;tidy.disabled=!!busy;if(busy)tidy.title="Finish or inspect the existing job first";tidy.onclick=function(){tidy.disabled=true;post("/api/mark_clean",{chore:c.id},c.name+" marked tidy · no points").finally(function(){tidy.disabled=false})};}
    var ro=n.querySelector('[data-a="reopen"]');if(ro)ro.onclick=function(){NOTEFORM={chore:c.id,mode:"reopen"};openPM("noteform")};
    var od=n.querySelector('[data-a="od"]');if(od)od.onclick=function(){if(od.dataset.on==="1")post("/api/close_od",{chore:c.id},c.name+" marked inactive");else post("/api/reopen",{chore:c.id},c.name+" marked active for the kids")};
    n.querySelector('[data-a="edit"]').onclick=function(){CHFORM={id:c.id};openPM("chform")}});
  $("nadd").onclick=function(){CHFORM={id:null};openPM("chform")};
  // recent
  var rc="";S.history.slice(0,25).forEach(function(h){var k=kidOf(h.kid),line,undo=h.id;
    if(h.type==="report"){line=E(h.chore_icon)+' '+esc(h.chore_name)+' — '+(h.status==="pending"?"waiting":h.status==="inspected"?E(inspOf(h.inspected_by).icon)+" +"+h.awarded:"sent back");undo=h.status==="pending"?h.id:h.inspect_id}
    else if(h.type==="spend")line=E(h.reward_icon)+' bought '+esc(h.reward_name)+' (−'+h.cost+')';
    else line=(h.points>0?"+":"")+h.points+' '+esc(h.reason||"")+' '+E(inspOf(h.by).icon);
    var chg=h.type==="report"&&h.status==="inspected"&&Date.now()/1000-(h.inspected_ts||0)<86400?'<button data-fix="'+h.id+'">✏️ Change</button>':'';
    rc+='<div class="card row"><span>'+E(k.icon)+'</span><span style="flex:1">'+line+((h.team||[]).length>1&&h.split?'<div class="mute">'+h.team.map(function(m){return esc(kidOf(m).name)+' '+(h.split[m]||0)}).join(' · ')+'</div>':'')+'<div class="mute">'+ago(h.ts)+'</div></span>'+chg+'<button data-u="'+undo+'">Undo</button></div>'});
  $("recent").innerHTML=rc;
  document.querySelectorAll("[data-u]").forEach(function(b){b.onclick=function(){if(confirm("Undo this?"))post("/api/undo",{ref:b.dataset.u},"Undone")}});
  document.querySelectorAll("#recent [data-fix]").forEach(function(b){b.onclick=function(){FIXJOB=b.dataset.fix;openPM("fixjob")}});
}
function load(){api("/api/state").then(function(s){S=s;var a=document.activeElement;if(!a||(a.tagName!=="INPUT"&&a.tagName!=="TEXTAREA")||a.type==="checkbox")render()})}
$("pmx").onclick=closePM;$("pm").onclick=function(e){if(e.target===$("pm"))closePM()};
load();setInterval(load,8000);
setInterval(function(){document.querySelectorAll(".cdu2[data-since]").forEach(function(n){var l=Math.round(Date.now()/1000-+n.dataset.since);n.textContent=Math.floor(l/60)+":"+("0"+l%60).slice(-2)});
  document.querySelectorAll(".cd[data-until]").forEach(function(n){var u=+n.dataset.until;if(!u)return;var l=Math.max(0,Math.round(u-Date.now()/1000));
  n.textContent=Math.floor(l/60)+":"+("0"+l%60).slice(-2)+" left"})},1000);

/* 🏠 The grown-ups' house jobs (Grocy): due chores, open tasks, batteries. ✓ records it done in Grocy. */
var HOUSE_DONE={};
function houseData(){
  if(HA_MODE){var h=hass(),st=h&&h.states["sensor.house_tasks"];return Promise.resolve(st?{on:true,items:st.attributes.items||[],private:st.attributes.private||[],to_review:st.attributes.to_review||0}:{on:false})}
  if(SANDBOX!=null)return Promise.resolve({on:false});
  return fetch("/api/house_jobs?display=").then(function(r){return r.json()}).catch(function(){return {on:false}})}
function hwhen(i){if(i.overdue)return '<span class="tag warn">overdue</span>';if(!i.due)return "";
  var d=new Date(i.due*1000);return '<span class="mute">'+(d.toDateString()===new Date().toDateString()?"today":d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"}))+'</span>'}
var HOUSE_OPEN=false;
function drawHouse(){houseData().then(function(h){var box=$("housebox");if(!h||!h.on){box.innerHTML="";return}
  var items=(h.items||[]).filter(function(i){return !HOUSE_DONE[i.kind+":"+i.id]});
  var priv=(h.private||[]).filter(function(p){return p.open});
  box.innerHTML='<details id="housedet"'+(HOUSE_OPEN?' open':'')+'><summary>🏠 House jobs <span class="mute">'+items.length+' due'+
    (h.to_review?' · '+h.to_review+' to review in Grocy':'')+'</span></summary>'+
    items.map(function(i){return '<div class="card row hrow"><b style="flex:1">'+(i.kind==="battery"?"🔋 ":"")+esc(i.name)+'</b>'+hwhen(i)+
      (i.rooms&&i.rooms.length?'<span class="mute">'+esc(i.rooms.slice(0,2).join(", "))+(i.rooms.length>2?"…":"")+'</span>':'')+
      '<button class="ok hdone" data-k="'+i.kind+'" data-i="'+i.id+'">✓</button></div>'}).join("")+
    priv.map(function(p){return '<div class="mute">🔒 '+esc(p.owner)+': '+p.open+' private'+(p.overdue?' ('+p.overdue+' overdue)':'')+'</div>'}).join("")+
    (items.length?'':'<div class="mute">Nothing due 🎉</div>')+'</details>';
  $("housedet").ontoggle=function(){HOUSE_OPEN=this.open};   // closed until a grown-up opens it; stays as they left it across refreshes
  box.querySelectorAll(".hdone").forEach(function(b){b.onclick=function(){var k=b.getAttribute("data-k"),id=+b.getAttribute("data-i");b.disabled=true;
    api("/api/house_done",{kind:k,id:id,by:me}).then(function(r){if(r&&r.ok){HOUSE_DONE[k+":"+id]=1;toast("✓ Done");drawHouse()}else{b.disabled=false;toast((r&&r.error)||"failed")}})}})})}
drawHouse();setInterval(drawHouse,60000);
</script></body></html>
