<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chore Inspection</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e5e7eb;--ok:#16a34a;--no:#dc2626;--acc:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1f27;--ink:#e8eaf0;--mute:#9aa3b2;--line:#2b313c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.35 system-ui,sans-serif;padding:12px 16px 60px;max-width:760px;margin:auto}
img.e{width:1.25em;height:1.25em;vertical-align:-.25em}
h1{font-size:22px;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
h2{font-size:17px;margin:20px 0 8px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.who{display:flex;gap:8px;margin-left:auto}
.who button{font-size:15px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:8px 12px;cursor:pointer}
button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
button.no{background:transparent;color:var(--no);border-color:var(--no)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:8px 0}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.big{font-size:30px}
.mute{color:var(--mute);font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{min-width:46px}
input,select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
input[type=number]{width:80px}
.bal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bal .card{text-align:center;margin:0}
.bal .n{font-size:30px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr;gap:6px}
.chore{display:flex;align-items:center;gap:8px;padding:8px 10px}
.chore .nm{flex:1}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line)}
.tag.bonus{background:#ffedd5;color:#9a3412}.tag.clean{background:#dcfce7;color:#166534}.tag.pend{background:#dbeafe;color:#1e40af}
.big2{font-size:22px;padding:10px 16px}
input[type=range]{width:100%;height:36px}
.tvgo{width:100%;font-size:22px;font-weight:800;padding:14px;margin-top:10px}
.topbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:2px 0 8px}.ttl{font-size:20px}
.chip{border-radius:999px;padding:6px 12px;font-weight:700}
.h2b{color:var(--ink);font-size:18px;text-transform:none;letter-spacing:0;margin:14px 0 6px}
details{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin:8px 0}
summary{font-weight:700;cursor:pointer;padding:4px 0}
.pmodal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:16px}
.pmodal.on{display:flex}.pbox{background:var(--bg);border-radius:18px;padding:16px;width:100%;max-width:640px;position:relative;margin-top:20px}
.px{position:absolute;top:6px;right:10px;font-size:34px;cursor:pointer;line-height:1}
details.cgrp{margin:6px 0;padding:4px 10px}
.pbar{position:relative;height:22px;background:#e9ecef;border-radius:12px;margin:34px 6px 22px;min-width:200px}
.pbar.big{height:34px;margin:36px 8px 24px;flex:1}
.pbar .pf{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:12px;background:linear-gradient(90deg,#ffd54a,#43a047)}
.pbar.over .pf{background:#ff9800}
.pbar .pm{position:absolute;top:-30px;transform:translateX(-50%);font-size:20px;white-space:nowrap;text-align:center;line-height:1}
.pbar .pm span{display:block;font-size:12px;font-weight:800;color:#555}
.pbar .pm::after{content:"";position:absolute;left:50%;top:26px;width:2px;height:26px;background:rgba(0,0,0,.3)}
.pbar.big .pm::after{height:38px}
.pbar .pm.pb{top:auto;bottom:-34px}.pbar .pm.pb::after{top:auto;bottom:22px}
.pbar .pr{position:absolute;top:-4px;font-size:26px;transform:translateX(-50%);left:0}
.pbar.big .pr{font-size:36px;top:-6px}
.empty{color:var(--mute);text-align:center;padding:16px}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .2s}
#toast.on{opacity:.92}
body.hub{max-width:none;font-size:20px}body.hub button{font-size:20px;padding:10px 14px}
</style></head><body>
<script>if(location.search.indexOf("hub=1")>=0)document.body.classList.add("hub")</script>
<div class="topbar"><span class="ttl" id="hicon"></span><b class="ttl">Chores</b>
  <button class="chip" id="ctchip"></button><button class="chip ok" id="tvbtn">📺 Give TV time</button><button class="chip" id="tourbtn">🚶 Price tour</button><div class="who" id="who"></div></div>

<div id="tvbox"></div>

<div id="pendwrap"><h2 class="h2b">🔍 Claimed done — inspect <span id="pcount" class="tag pend"></span></h2>
<div id="pending"></div></div>

<div id="actbox"></div>
<div id="pzbox"></div>
<div id="housebox"></div>

<details><summary>⭐ Points <span class="mute" id="balsum"></span></summary><div class="bal" id="bal"></div>
<div class="card" style="margin-top:8px"><b>Give or take points</b>
  <div class="row" id="adjkids" style="margin-top:6px"></div>
  <div class="chips" id="adjpts"></div>
  <div class="row" style="margin-top:8px"><input id="adjreason" placeholder="What for? (e.g. folded towels, hitting)" style="flex:1"><button class="ok" id="adjgo">Save</button></div>
</div></details>

<details><summary>🎁 Presents (toy swap)</summary><div id="presentsadm"></div></details>

<details><summary>🧹 Chore chart</summary>
<div class="mute">Change the price for the next cleaning only, reopen a room, or edit the chart.</div>
<div class="grid" id="chart"></div>
<div class="card row"><input id="nname" placeholder="New chore" style="flex:1"><input id="npts" type="number" placeholder="pts" min="0" max="50"><label class="mute"><input type="checkbox" id="nroom" checked> room (stays clean 3 days)</label><button id="nadd">Add</button></div>
</details>

<details><summary>🕘 Recent</summary><div id="recent"></div></details>

<div class="pmodal" id="pm"><div class="pbox"><div class="px" id="pmx">&times;</div><div id="pmbody"></div></div></div>
<div id="toast"></div>

<script>

var _q=[],_sess=Math.random().toString(36).slice(2,8);
function L(ev,data){var o={ev:ev,page:location.pathname,sess:_sess,t:Date.now()/1000};if(typeof kid!=="undefined"&&kid)o.kid=kid;if(data)for(var k in data)o[k]=data[k];_q.push(o);if(_q.length>=20)flushL()}
function flushL(){if(!_q.length)return;if(location.pathname.indexOf("/local/")===0){_q=[];return}var b=JSON.stringify(_q);_q=[];try{fetch("/api/log",{method:"POST",headers:{"Content-Type":"application/json"},body:b,keepalive:true})}catch(e){}}
setInterval(flushL,3000);addEventListener("pagehide",flushL);
addEventListener("error",function(e){L("js_error",{msg:String(e.message),line:e.lineno})});
document.addEventListener("click",function(e){var n=e.target.closest("[data-c],[data-k],[data-r],[data-f],[data-tv],[data-p],[data-x],[data-u],[data-a],[data-i],[data-n],button,.homebtn,#exit,.x,.btn");
  L("tap",{target:n?(n.id||n.className||n.tagName):String(e.target.tagName),data:n?Object.assign({},n.dataset):null,x:Math.round(e.clientX),y:Math.round(e.clientY)})},true);
L("load",{w:innerWidth,h:innerHeight,ua:navigator.userAgent.slice(0,120),q:location.search});
var TW="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/";
var CUSTOM_ICONS={"x-chandelier":"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Cg%20fill%3D%22none%22%20stroke-linecap%3D%22round%22%3E%3Cpath%20d%3D%22M32%202v14%22%20stroke%3D%22%237a5a1e%22%20stroke-width%3D%222.5%22/%3E%3Cpath%20d%3D%22M8%2030c4%2010%2020%2012%2024%202c4%2010%2020%208%2024-2%22%20stroke%3D%22%23c9952b%22%20stroke-width%3D%223.5%22/%3E%3Cpath%20d%3D%22M20%2034c3%206%209%206%2012%200c3%206%209%206%2012%200%22%20stroke%3D%22%23c9952b%22%20stroke-width%3D%223%22/%3E%3C/g%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2220%22%20r%3D%225%22%20fill%3D%22%23e0b040%22/%3E%3Cpath%20d%3D%22M29%2024h6l-1%2010h-4z%22%20fill%3D%22%23c9952b%22/%3E%3Cg%20fill%3D%22%23fff8e1%22%20stroke%3D%22%23c9952b%22%20stroke-width%3D%221.5%22%3E%3Crect%20x%3D%225%22%20y%3D%2220%22%20width%3D%226%22%20height%3D%2210%22%20rx%3D%221%22/%3E%3Crect%20x%3D%2253%22%20y%3D%2220%22%20width%3D%226%22%20height%3D%2210%22%20rx%3D%221%22/%3E%3Crect%20x%3D%2217%22%20y%3D%2224%22%20width%3D%226%22%20height%3D%2210%22%20rx%3D%221%22/%3E%3Crect%20x%3D%2241%22%20y%3D%2224%22%20width%3D%226%22%20height%3D%2210%22%20rx%3D%221%22/%3E%3C/g%3E%3Cg%20fill%3D%22%23ffb300%22%3E%3Cpath%20d%3D%22M8%2012c3%204%203%206%200%208c-3-2-3-4%200-8z%22/%3E%3Cpath%20d%3D%22M56%2012c3%204%203%206%200%208c-3-2-3-4%200-8z%22/%3E%3Cpath%20d%3D%22M20%2016c3%204%203%206%200%208c-3-2-3-4%200-8z%22/%3E%3Cpath%20d%3D%22M44%2016c3%204%203%206%200%208c-3-2-3-4%200-8z%22/%3E%3C/g%3E%3Cg%20fill%3D%22%239ad7ff%22%20stroke%3D%22%234fa3d1%22%20stroke-width%3D%221%22%3E%3Cpath%20d%3D%22M14%2040l3%205-3%205-3-5z%22/%3E%3Cpath%20d%3D%22M32%2040l3%206-3%206-3-6z%22/%3E%3Cpath%20d%3D%22M50%2040l3%205-3%205-3-5z%22/%3E%3Cpath%20d%3D%22M23%2044l2%204-2%204-2-4z%22/%3E%3Cpath%20d%3D%22M41%2044l2%204-2%204-2-4z%22/%3E%3C/g%3E%3C/svg%3E"};
function cp(c){if(CUSTOM_ICONS[c])return "";return c.split("-").map(function(h){return String.fromCodePoint(parseInt(h,16))}).join("")}
function E(c){if(c&&CUSTOM_ICONS[c])return '<img class="e" src="'+CUSTOM_ICONS[c]+'" alt="">';return c?'<img class="e" src="'+TW+c+'.svg" alt="'+cp(c)+'" onerror="this.outerHTML=this.alt">':""}
function $(i){return document.getElementById(i)}
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var S=null,me=null,adjKid=null,adjPts=null;
try{me=localStorage.getItem("inspector")}catch(e){}
function api(p,b){return fetch(p,{method:b?"POST":"GET",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined}).then(function(r){return r.json()})}

var HA_MODE=location.pathname.indexOf("/local/")===0,haUserMe=null;
var ON_HUB=location.search.indexOf("hub=1")>=0,qby=(location.search.match(/[?&]by=([a-z]+)/)||[])[1];
function hass(){try{return window.parent.document.querySelector("home-assistant").hass}catch(e){return null}}
function haState(){var h=hass();var st=h&&h.states["sensor.chore_state"];if(!st)return null;var a=JSON.parse(JSON.stringify(st.attributes));a.now=Date.now()/1000;return a}
if(HA_MODE){
  api=function(path,body){
    if(!body)return new Promise(function(res,rej){var t=0;(function w(){var st=haState();if(st)return res(st);if(++t>40)return rej("no sensor.chore_state");setTimeout(w,250)})()});
    var n=Math.random().toString(36).slice(2,9),msg=Object.assign({a:path.replace("/api/",""),n:n},body);
    var v=JSON.stringify(msg);
    function send1(val,nn){return hass().callService("input_text","set_value",{entity_id:"input_text.chore_action",value:val}).then(function(){
      return new Promise(function(res){var t=0;(function w(){var h=hass(),a=h&&h.states["sensor.chore_state"]&&h.states["sensor.chore_state"].attributes;
        if(a&&a.last_result&&a.last_result.n===nn){var st=haState();return res({ok:a.last_result.ok,error:a.last_result.error,state:st})}
        if(++t>60)return res({ok:false,error:"no answer from chore app"});setTimeout(w,250)})()})})}
    if(v.length<=255)return send1(v,n);
    // HA input_text holds 255 chars: send long actions (lists of fixes) in acknowledged pieces; the app reassembles them.
    var parts=[],rest=v,id=n;while(rest.length){var k=Math.min(rest.length,200),p;
      while(true){p=JSON.stringify({a:"_part",n:"",id:id,i:parts.length,of:0,d:rest.slice(0,k)});if(p.length<=240||k<10)break;k=Math.floor(k*0.8)}
      parts.push(rest.slice(0,k));rest=rest.slice(k)}
    var chain=Promise.resolve({ok:true});parts.forEach(function(d,i){chain=chain.then(function(r){if(!r.ok)return r;var nn=i===parts.length-1?n:n+"p"+i;
      return send1(JSON.stringify({a:"_part",n:nn,id:id,i:i,of:parts.length,d:d}),nn)})});
    return chain;
  };
  try{var nm=(hass().user.name||"").toLowerCase(),I=((hass().states["sensor.chore_state"]||{}).attributes||{}).config.inspectors||[];   // the HA login names the grown-up
    var hit=I.find(function(i){return nm.indexOf(String(i.name).toLowerCase())>=0||nm.indexOf(i.id)>=0});if(hit)haUserMe=hit.id}catch(e){}
  if(haUserMe)me=haUserMe;
}
if(ON_HUB){if(qby)me=qby;
  document.addEventListener("DOMContentLoaded",function(){});
  var BACK=((location.search.match(/[?&]back=([a-z]+)/)||[])[1]==="now")?"/now":"/";   // the kitchen Hub's grown-up board comes back to itself
  var hubIdle=null;function hubPoke(){clearTimeout(hubIdle);hubIdle=setTimeout(function(){location.href=BACK+"?v="+Date.now()},300000)}
  document.addEventListener("click",hubPoke,true);document.addEventListener("touchstart",hubPoke,{passive:true});hubPoke();
  setTimeout(function(){var d=document.createElement("button");d.textContent=BACK==="/now"?"✅ Done":"✅ Done — back to kids";d.className="ok";
    d.style.cssText="position:fixed;top:10px;right:12px;z-index:70;font-size:22px;padding:10px 18px";d.onclick=function(){location.href=BACK+"?v="+Date.now()};document.body.appendChild(d)},50)}
function toast(t){if(!t)return;$("toast").textContent=t;$("toast").classList.add("on");setTimeout(function(){$("toast").classList.remove("on")},1800)}
function post(p,b,msg){if(!me){toast("Pick who you are first");return Promise.resolve()}b.by=me;return api(p,b).then(function(r){if(r.ok){S=r.state;render();if(msg)toast(msg)}else toast(r.error||"failed")})}
function kidOf(id){return S.config.kids.find(function(k){return k.id===id})||{name:id}}
function inspOf(id){return S.config.inspectors.find(function(k){return k.id===id})||{name:id}}
function choreOf(id){return S.config.chores.find(function(k){return k.id===id})||{name:id}}
function ago(ts){var s=S.now-ts;if(s<90)return"just now";if(s<5400)return Math.round(s/60)+" min ago";if(s<129600)return Math.round(s/3600)+" h ago";return Math.round(s/86400)+" d ago"}
function feel(f){var x=(S.config.feelings||[]).find(function(y){return y.id===f});return x?E(x.icon):""}

var PM=null,TOUR=null,MOSTLY=null,NOTEFORM=null,NOTYET=null;
function renderNotYet(){if($("nyfb"))return;var r=S.history.find(function(h){return h.id===NOTYET});if(!r){closePM();return}
  $("pmbody").innerHTML='<h2 class="h2b">Not yet: '+E(r.chore_icon)+' '+esc(r.chore_name)+'</h2><div class="mute">The chore goes back to '+esc((r.team||[r.kid]).map(function(x){return kidOf(x).name}).join(" + "))+' with the timer resuming. They tap Inspect again when it\'s fixed.</div>'+
    '<label class="mute" style="display:block;margin-top:10px">What still needs fixing? (add each one — kids see each as a bullet)</label>'+
    ''+listEd("nyfb","","e.g. balloon on the floor")+
    '<button class="no tvgo" id="nygo" style="background:#c62828;color:#fff">Hand it back to fix</button>';
  wireList("nyfb");$("nygo").onclick=function(){post("/api/inspect",{ref:r.id,ok:false,feedback:$("nyfb").value.trim()},"Handed back to fix").then(closePM)}}
function listEd(id,text,ph){return '<textarea id="'+id+'" style="display:none">'+esc(text||"")+'</textarea><div id="'+id+'L" style="margin:4px 0"></div>'+
  '<div class="row"><input id="'+id+'I" placeholder="'+ph+'" style="flex:1;font-size:18px;min-width:0" enterkeyhint="done"><button class="ok" id="'+id+'A" style="font-size:18px">＋ Add</button></div>'}
function wireList(id){var ta=$(id),inp=$(id+"I");if(!ta||!inp)return;var items=(ta.value||"").split("\n").map(function(t){return t.trim()}).filter(Boolean);
  function sync(){ta.value=items.concat(inp.value.trim()?[inp.value.trim()]:[]).join("\n");if(ta.oninput)ta.oninput.call(ta)}
  function draw(){var L=$(id+"L");L.innerHTML=items.length?items.map(function(t,i){return '<div class="row" style="padding:6px 8px;margin:3px 0;background:rgba(127,127,127,.12);border-radius:8px"><span style="flex:1;font-size:18px">'+(i+1)+'. '+esc(t)+'</span><button data-i="'+i+'" title="Remove">✕</button></div>'}).join(""):'<div class="mute">Nothing added yet. Type one thing, tap ＋ Add, then the next.</div>';
    L.querySelectorAll("button[data-i]").forEach(function(b){b.onclick=function(){items.splice(+b.dataset.i,1);draw();sync()}})}
  function add(){var t=inp.value.trim();if(!t){inp.focus();return}items.push(t);inp.value="";draw();sync();inp.focus()}
  $(id+"A").onclick=add;inp.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();add()}};inp.oninput=sync;draw()}
function ptsSlider(id,v,base,mx){v=v==null?0:v;mx=mx||Math.max(10,(base||0)*3,v);
  return '<div style="text-align:center;font-size:40px;font-weight:800;margin:6px 0" id="'+id+'v">'+v+' ⭐</div>'+
    '<input type="range" id="'+id+'" min="0" max="'+mx+'" step="1" value="'+v+'">'+
    '<div class="row mute" style="justify-content:space-between"><span>0</span>'+(base!=null?'<span>usual: '+base+'</span>':'')+'<span>'+mx+'</span></div>'}
function wireSlider(id,base,cb){var s=$(id);if(!s)return;s.oninput=function(){var v=+s.value,d=$(id+"v");d.textContent=v+" ⭐";
  d.style.color=base==null?"":v>base?"#d50000":v<base?"#1e88e5":"";if(cb)cb(v)}}
function renderNoteForm(){if($("nfnote"))return;var c=choreOf(NOTEFORM.chore),bd=S.board[c.id]||{},cur=bd.price!=null?bd.price:c.points;
  $("pmbody").innerHTML='<h2 class="h2b">'+E(c.icon)+' '+esc(c.name)+'</h2><div class="mute">'+(NOTEFORM.mode==="reopen"?"Reopen it so a kid can do it again.":"Set the price for its next cleaning.")+'</div>'+
    '<label class="mute" style="display:block;margin-top:10px">Points</label>'+ptsSlider("nfpts",cur,c.points)+
    '<label class="mute" style="display:block;margin-top:10px">📝 What needs doing? (kids see this)</label>'+listEd("nfnote",bd.note||"","e.g. toys under the couch")+
    '<button class="ok tvgo" id="nfgo">'+(NOTEFORM.mode==="reopen"?"Reopen":"Save")+'</button>';
  $("nfgo").onclick=function(){var pts=$("nfpts").value,note=$("nfnote").value.trim(),chain=Promise.resolve();
    if(NOTEFORM.mode==="reopen")chain=post("/api/reopen",{chore:c.id,note:note},c.name+" reopened");
    if(!(cur==null&&+pts===0)&&+pts!==cur)chain=chain.then(function(){return post("/api/price",{chore:c.id,points:+pts,note:note},"Price "+pts)});
    else if(NOTEFORM.mode!=="reopen")chain=chain.then(function(){return post("/api/note",{chore:c.id,note:note},"Note saved")});
    chain.then(closePM)};wireSlider("nfpts",c.points);wireList("nfnote")}
function renderMostly(){var r=S.history.find(function(h){return h.id===MOSTLY});if(!r){closePM();return}var k=kidOf(r.kid);
  if($("mnow"))return;  // keep what the parent is typing
  $("pmbody").innerHTML='<h2 class="h2b">🧩 Mostly done</h2><div class="card row"><span class="big">'+E(k.icon)+E(r.chore_icon)+'</span><b>'+esc(k.name)+' · '+esc(r.chore_name)+'</b><span class="mute">full job '+r.points+' ⭐</span></div>'+

    else if(h.type==="spend")line=E(h.reward_icon)+' bought '+esc(h.reward_name)+' (−'+h.cost+')';
    else line=(h.points>0?"+":"")+h.points+' '+esc(h.reason||"")+' '+E(inspOf(h.by).icon);
    rc+='<div class="card row"><span>'+E(k.icon)+'</span><span style="flex:1">'+line+'<div class="mute">'+ago(h.ts)+'</div></span><button data-u="'+undo+'">Undo</button></div>'});
  $("recent").innerHTML=rc;
  document.querySelectorAll("[data-u]").forEach(function(b){b.onclick=function(){if(confirm("Undo this?"))post("/api/undo",{ref:b.dataset.u},"Undone")}});
}
function load(){api("/api/state").then(function(s){S=s;var a=document.activeElement;if(!a||(a.tagName!=="INPUT"&&a.tagName!=="TEXTAREA")||a.type==="checkbox")render()})}
$("pmx").onclick=closePM;$("pm").onclick=function(e){if(e.target===$("pm"))closePM()};
load();setInterval(load,8000);
setInterval(function(){document.querySelectorAll(".cdu2[data-since]").forEach(function(n){var l=Math.round(Date.now()/1000-+n.dataset.since);n.textContent=Math.floor(l/60)+":"+("0"+l%60).slice(-2)});
  document.querySelectorAll(".cd[data-until]").forEach(function(n){var u=+n.dataset.until;if(!u)return;var l=Math.max(0,Math.round(u-Date.now()/1000));
  n.textContent=Math.floor(l/60)+":"+("0"+l%60).slice(-2)+" left"})},1000);

/* 🏠 The grown-ups' house jobs (Grocy): due chores, open tasks, batteries. ✓ records it done in Grocy. */
var HOUSE_DONE={};
function houseData(){
  if(HA_MODE){var h=hass(),st=h&&h.states["sensor.house_tasks"];return Promise.resolve(st?{on:true,items:st.attributes.items||[],private:st.attributes.private||[],to_review:st.attributes.to_review||0}:{on:false})}
  return fetch("/api/house_jobs?display=").then(function(r){return r.json()}).catch(function(){return {on:false}})}
function hwhen(i){if(i.overdue)return '<span class="tag" style="background:#ffebee;color:#c62828">overdue</span>';if(!i.due)return "";
  var d=new Date(i.due*1000);return '<span class="mute">'+(d.toDateString()===new Date().toDateString()?"today":d.toLocaleDateString([], {weekday:"short",month:"short",day:"numeric"}))+'</span>'}
function drawHouse(){houseData().then(function(h){var box=$("housebox");if(!h||!h.on){box.innerHTML="";return}
  var items=(h.items||[]).filter(function(i){return !HOUSE_DONE[i.kind+":"+i.id]});
  var priv=(h.private||[]).filter(function(p){return p.open});
  box.innerHTML='<details'+(items.some(function(i){return i.overdue})?' open':'')+'><summary>🏠 House jobs <span class="mute">'+items.length+' due'+
    (h.to_review?' · '+h.to_review+' to review in Grocy':'')+'</span></summary>'+
    items.map(function(i){return '<div class="card row"><b style="flex:1">'+(i.kind==="battery"?"🔋 ":"")+esc(i.name)+'</b>'+hwhen(i)+
      (i.rooms&&i.rooms.length?'<span class="mute">'+esc(i.rooms.slice(0,2).join(", "))+(i.rooms.length>2?"…":"")+'</span>':'')+
      '<button class="ok hdone" data-k="'+i.kind+'" data-i="'+i.id+'">✓</button></div>'}).join("")+
    priv.map(function(p){return '<div class="mute">🔒 '+esc(p.owner)+': '+p.open+' private'+(p.overdue?' ('+p.overdue+' overdue)':'')+'</div>'}).join("")+
    (items.length?'':'<div class="mute">Nothing due 🎉</div>')+'</details>';
  box.querySelectorAll(".hdone").forEach(function(b){b.onclick=function(){var k=b.getAttribute("data-k"),id=+b.getAttribute("data-i");b.disabled=true;
    api("/api/house_done",{kind:k,id:id,by:me}).then(function(r){if(r&&r.ok){HOUSE_DONE[k+":"+id]=1;toast("✓ Done");drawHouse()}else{b.disabled=false;toast((r&&r.error)||"failed")}})}})})}
drawHouse();setInterval(drawHouse,60000);
</script></body></html>
