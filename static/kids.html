<style>

.kidcard .badge{position:absolute;top:14px;right:16px;font-size:30px}

/* ---------- kid screen ---------- */
#kid{padding:12px 14px}
.top{display:flex;align-items:center;gap:12px}

.menubtn:active{transform:scale(.94)}.menubtn .mi{font-size:38px}.menubtn .bal{margin:0;padding:0;background:none;box-shadow:none;font-size:34px}
.kmenu{display:none;position:absolute;z-index:48;top:82px;right:14px;width:min(540px,calc(100vw - 28px));max-height:calc(100vh - 96px);overflow-y:auto;background:#fff;border:5px solid var(--kid);border-radius:28px;padding:12px;box-shadow:0 16px 45px rgba(0,0,0,.35)}
.kmenu.on{display:block}.kmgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.kmcard{background:#f4f4f7;border-radius:20px;padding:10px 12px;font-size:20px;font-weight:900;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.09)}
.kmcard:active{transform:scale(.97)}.kmcard .kmi{font-size:34px}.kmcard .kms{display:block;font-size:16px;font-weight:700;opacity:.72;margin-top:2px}.mustban{display:none;background:#fff3c4;border:4px solid #f5b400;border-radius:18px;margin:8px 6px 2px;padding:7px 12px;text-align:center;font-size:24px;font-weight:900}

#calendar{padding:12px;background:linear-gradient(160deg,#f7fbff,#fff8e8)}
.calhead{display:flex;align-items:center;gap:14px;margin-bottom:10px}.calback,.calnav{background:#fff;border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.12);font-size:38px;font-weight:900;padding:4px 16px}
.calback:active,.calnav:active{transform:scale(.92)}.caltitle{flex:1;text-align:center;font-size:34px;font-weight:900}.calnav{min-width:92px;text-align:center;color:var(--kid)}

.calgrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.calday{min-width:0;background:rgba(255,255,255,.85);border:3px solid #dce4ea;border-radius:20px;padding:7px;overflow-y:auto;overscroll-behavior:contain}.calday.today{border:6px solid #ffb300;background:#fff8d6;padding:4px;box-shadow:0 0 0 3px rgba(255,179,0,.2)}
.caldow{text-align:center;text-transform:uppercase;font-size:17px;font-weight:900;letter-spacing:.5px;color:#52616b}.calnum{text-align:center;font-size:30px;font-weight:900;line-height:1.05;margin:2px 0 7px}.calday.today .calnum::after{content:" TODAY";display:block;font-size:12px;color:#9a5800;letter-spacing:.5px}.calevent{border-radius:12px;background:#607d8b;color:#fff;padding:5px 7px;margin:5px 0;font-size:15px;font-weight:900;line-height:1.15;overflow-wrap:anywhere;border-left:7px solid rgba(0,0,0,.2)}.calevent.kids{background:#1565c0}.calevent.family{background:#ad1457}.caltime{display:block;font-size:12px;font-weight:800;opacity:.9;margin-bottom:2px}.calempty{text-align:center;color:#90a4ae;font-size:13px;font-weight:800;margin-top:14px}
/* ---------- full-screen menu details ---------- */
#detail{padding:12px;background:linear-gradient(160deg,#f8fbff,#fff7ea);z-index:41}.dethead{display:flex;align-items:center;gap:14px}.detback{background:#fff;border-radius:22px;box-shadow:0 5px 0 rgba(0,0,0,.12);font-size:30px;font-weight:900;padding:7px 16px}.dettitle{font-size:42px;font-weight:900}.detbody{flex:1;overflow-y:auto;overscroll-behavior:contain;margin-top:12px;padding:2px 8px 18px}.detsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.detcard{background:#fff;border-radius:24px;padding:14px 18px;box-shadow:0 5px 0 rgba(0,0,0,.1);font-size:20px;font-weight:800}.detcard .dn{font-size:48px;font-weight:900;color:var(--kid)}.detlist{max-width:900px;margin:14px auto}.detrow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:10px 14px;margin:8px 0;font-size:20px;font-weight:800;box-shadow:0 3px 0 rgba(0,0,0,.08)}.detrow .di{font-size:38px}.detrow .dr{margin-left:auto;font-weight:900;color:var(--kid);white-space:nowrap}.detrewards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;max-width:1000px;margin:16px auto}.detreward{background:#fff;border:4px solid transparent;border-radius:24px;padding:14px;text-align:center;font-size:20px;font-weight:900;box-shadow:0 4px 0 rgba(0,0,0,.1)}.detreward.on{border-color:var(--kid)}.detreward .ri{font-size:62px}.detreward:active{transform:scale(.96)}
.paperadd{display:block;margin:12px auto 18px;background:var(--kid);color:#fff;border-radius:22px;padding:12px 24px;font-size:28px;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.paperpreview{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:#111;color:#fff}.paperpreview.on{display:flex}.paperbar{display:flex;align-items:center;gap:12px;min-height:62px;padding:8px 14px;background:#171717}.papertitle{flex:1;min-width:0;font-size:22px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.paperclose{background:#fff;color:#111;border-radius:18px;padding:8px 18px;font-size:22px;font-weight:900}.paperpages{flex:1;min-height:0;overflow:auto;padding:12px;touch-action:pan-x pan-y pinch-zoom;text-align:center}.paperpages img{display:block;max-width:100%;height:auto;margin:0 auto 14px;background:#fff;box-shadow:0 2px 16px #000}

lay:flex;align-items:center;gap:7px;background:#f1f3f5;border:3px solid transparent;border-radius:15px;padding:7px;font-size:16px;font-weight:850;min-height:48px}.packitem.on{background:#dff5df;border-color:#43a047}.packitem .pi{font-size:27px}.packnote{font-size:14px;font-weight:750;opacity:.72}.packfinish{max-width:850px;margin:16px auto;background:#fff;border:6px solid #43a047;border-radius:28px;padding:16px;text-align:center;font-size:24px;font-weight:900}.packfinish .pf{font-size:70px}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.packrule{max-width:960px;margin:9px auto;background:#38265f;color:#fff;border-radius:22px;padding:12px 18px;text-align:center;font-size:20px;font-weight:850}.packrule b{color:#ffe082}.packprofiles{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:8px auto}.packprofile{background:#fff;border:4px solid transparent;border-radius:18px;padding:8px 15px;font-size:19px;font-weight:900;box-shadow:0 4px 0 #0002}.packprofile.on{border-color:#5e35b1;background:#ede7f6}.packstage{max-width:1000px;margin:10px auto;background:#fff;border-radius:26px;padding:15px 18px;box-shadow:0 5px 0 #0002}.packstage h2{margin:0 0 7px;font-size:27px}.packsteps{display:flex;justify-content:center;align-items:center;gap:5px;flex-wrap:wrap;margin:8px auto}.packstep{background:#fff8;border:3px solid #fff;border-radius:999px;padding:5px 11px;font-size:15px;font-weight:900}.packstep.on{background:#38265f;color:#fff}.packstep.done{background:#2e7d32;color:#fff}.packpiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:1080px;margin:12px auto}.packpile{background:#fff;border-radius:24px;padding:13px 15px;box-shadow:0 5px 0 #0002;border:4px solid transparent}.packpile h3{margin:0 0 3px;font-size:25px}.packline{display:flex;align-items:center;gap:10px;background:#f1f3f5;border:3px solid transparent;border-radius:15px;padding:9px;margin:7px 0;min-height:58px;font-size:17px;font-weight:850}.packline.on{background:#e8f5e9;border-color:#43a047}.packline.fix{background:#ffebee;border-color:#d32f2f}.packline .pi{font-size:31px;flex:none}.packline .pl{flex:1}.packline .ps{display:block;font-size:13px;font-weight:750;opacity:.7}.packaction{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px auto}.packaction .btn{font-size:23px}.packcriteria{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.packcriterion{background:#ede7f6;border-radius:14px;padding:9px 12px;font-size:18px;font-weight:900}.packinspectitem{max-width:800px;margin:12px auto;background:#fff;border:6px solid #5e35b1;border-radius:28px;padding:17px;box-shadow:0 7px 0 #0002}.packinspectitem .big{font-size:70px;text-align:center}.packinspectitem h2{text-align:center;font-size:30px;margin:2px}.packinspectitem .packnote{text-align:center;font-size:17px}.packwarn{background:#ffebee;color:#9b1c1c;border:4px solid #ef5350;border-radius:18px;padding:10px 14px;margin:9px auto;max-width:900px;text-align:center;font-size:19px;font-weight:900}.packdone{max-width:900px;margin:16px auto;background:#fff;border:7px solid #43a047;border-radius:30px;padding:20px;text-align:center;box-shadow:0 8px 0 #0002}.packdone .pf{font-size:86px}.packdone h2{font-size:34px;margin:3px}.packpreview{background:#fff3c4;border:3px solid #f5b400;border-radius:16px;padding:7px 12px;margin:7px auto;max-width:800px;text-align:center;font-size:16px;font-weight:850}
@media(max-width:800px){.packtop{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"back title reset" "score score score";align-items:center}.packback{grid-area:back}.packtitle{grid-area:title;font-size:23px;line-height:1.1}.packreset{grid-area:reset;font-size:20px}.packscore{grid-area:score;justify-self:center;margin-top:5px;padding:4px 18px;font-size:23px}.bagopts{grid-template-columns:1fr}.packmissions{grid-template-columns:1fr}.packitems{grid-template-columns:1fr}.packpiles{grid-template-columns:1fr}.packcriteria{grid-template-columns:1fr}.packrule{font-size:17px}.packstage{padding:12px}.packprofile{font-size:16px}}
/* progress bar */
.goalrow{display:flex;align-items:center;gap:12px;margin:14px 6px 4px 10px}
.barwrap{position:relative;flex:1;height:46px}
.goalbtn{min-width:110px;background:#fff;border-radius:24px;padding:4px 12px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12);border:4px solid var(--kid);line-height:1}
.goalbtn:active{transform:scale(.92)}.goalbtn .gi{font-size:52px}.goalbtn .gc{font-size:20px;font-weight:900}
.goalbtn .gt{font-size:13px;font-weight:800;opacity:.6}
.bar{position:absolute;inset:0;border-radius:30px;background:#fff;box-shadow:inset 0 4px 8px rgba(0,0,0,.12);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:30px;background:var(--kid);transition:width 1.4s cubic-bezier(.2,1.4,.4,1)}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 60%)}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
.pend{position:absolute;top:0;bottom:0;width:0;border-radius:30px;opacity:.55;transition:all 1.2s;
  background:repeating-linear-gradient(45deg,var(--kid) 0 12px,#fff 12px 24px);background-size:34px 34px}
@keyframes stripes{to{background-position:34px 0}}
.mark{position:absolute;top:-30px;transform:translateX(-50%);font-size:38px;text-align:center;line-height:1}
.mark.got{animation:pulse 1s infinite;filter:drop-shadow(0 0 8px gold)}
.mark .tick{display:block;width:4px;height:52px;background:rgba(0,0,0,.15);margin:2px auto 0}
.barlbl{text-align:center;font-size:22px;font-weight:800;min-height:28px;color:#555}
/* body */
.body{flex:1;display:flex;gap:14px;min-height:0;margin-top:6px}
.chorewrap{flex:2.2;display:flex;flex-direction:column;min-height:0}
.chores{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:12px;padding:6px 4px;overflow:hidden}
.chores.two{grid-template-rows:repeat(2,1fr)}
.pager{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 0}
.pg{font-size:44px;background:#fff;border-radius:22px;padding:0 34px;box-shadow:0 5px 0 rgba(0,0,0,.12);color:var(--kid)}
.pg:active{transform:scale(.9)}.pg.off{opacity:.2}
#pgdots span,.pgd span{display:inline-block;width:18px;height:18px;border-radius:50%;background:#ccc;margin:0 5px}#pgdots span.on,.pgd span.on{background:var(--kid)}
.pager.sm{gap:12px;padding:4px 0}.pager.sm .pg{font-size:30px;padding:0 22px}
.fold{cursor:pointer;user-select:none}.fold .sum{margin-left:auto;font-size:18px;font-weight:800;opacity:.75}.fold .chev{font-size:22px;color:var(--kid);margin-left:6px}
.tile{background:var(--card);border-radius:26px;padding:10px 4px 8px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.10);
  transition:transform .12s;position:relative;border:4px solid transparent}
.tile:active{transform:scale(.92)}
.tile .ic{font-size:60px;line-height:1.05}
.tile .tn{font-size:16px;font-weight:800;line-height:1.1;min-height:36px;display:flex;align-items:center;justify-content:center}
.tile .st{font-size:20px;letter-spacing:-2px}
.tile.waiting{border-color:var(--kid)}
.tile.clean{opacity:.45;filter:grayscale(.7)}
.tile.taken{opacity:.6}
.tile .cb{position:absolute;top:-8px;left:-4px;font-size:30px}
.tile.cheaper{border-color:#64b5f6}
.tile.bonus{border-color:#ff9800;box-shadow:0 0 0 3px #ffc83d,0 0 18px #ff9800}
.tile.waiting::before{content:"🔍";position:absolute;top:-6px;right:-4px;font-size:30px;animation:pulse 1.2s infinite}
.side{flex:1;display:flex;flex-direction:column;gap:8px;min-width:260px;overflow:hidden}
.panel{background:rgba(255,255,255,.75);border-radius:26px;padding:10px 12px}
.panel h2{margin:0 0 6px;font-size:26px;display:flex;align-items:center;gap:6px}
.rw{display:flex;align-items:center;gap:10px;padding:8px;border-radius:20px;margin:4px 0;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08);position:relative}
.rw:active{transform:scale(.95)}
.rw .ic{font-size:40px}
.rw .ring{margin-left:auto;font-size:22px;font-weight:900;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--kid) calc(var(--p)*1%),#e6e6e6 0)}
.rw .ring span{background:#fff;border-radius:50%;width:50px;height:50px;display:grid;place-items:center}
.rw.can{box-shadow:0 0 0 3px var(--kid)}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}
.hist{display:flex;flex-direction:column;gap:6px}
.h{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:4px 10px;font-size:20px;font-weight:800}
.h{cursor:pointer}.h:active{transform:scale(.96)}
.h .ic{font-size:38px}.h .s{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:26px}
.h .s.wait{animation:pulse 1.3s infinite}
/* modal */
.modal{position:absolute;inset:0;background:rgba(20,20,40,.55);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.modal.on{display:flex}
.mx{position:sticky;top:0;z-index:3;float:right;width:62px;height:62px;margin:0 0 5px 10px;border-radius:50%;background:#fff;color:#222;font:900 50px/56px system-ui,sans-serif;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 0 4px #333}

var CALWEEK=null;
function calKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function calWeek(d){var x=new Date(d.getFullYear(),d.getMonth(),d.getDate()),n=(x.getDay()+6)%7;x.setDate(x.getDate()-n);return x}
function calSource(e){return /kids?/i.test(String(e.source||""))?"kids":"family"}
function calOnDay(e,d){
  var key=calKey(d),tom=new Date(d);tom.setDate(tom.getDate()+1);
  return e.all_day?String(e.start)<=key&&String(e.end)>key:Number(e.start)<tom.getTime()/1000&&Number(e.end)>d.getTime()/1000
}
function renderCalendar(){

  var end=new Date(CALWEEK);end.setDate(end.getDate()+6);
  $("caltitle").textContent=CALWEEK.getFullYear()===end.getFullYear()&&CALWEEK.getMonth()===end.getMonth()?CALWEEK.toLocaleDateString([],{month:"long",day:"numeric"})+" – "+end.getDate()+", "+end.getFullYear():CALWEEK.toLocaleDateString([],{month:"short",day:"numeric"})+" – "+end.toLocaleDateString([],{month:"short",day:"numeric",year:"numeric"});

  $("callegend").innerHTML=sources.map(function(s){return '<span class="calkey"><span class="caldot '+calSource({source:s})+'"></span>'+safeText(s)+'</span>'}).join("");
  for(var i=0;i<7;i++){

    html+='<div class="calday'+(calKey(d)===today?' today':'')+'"><div class="caldow">'+d.toLocaleDateString([],{weekday:"short"})+'</div><div class="calnum">'+d.getDate()+'</div>'+

function seenKey(k){return "seen_"+k}
function getSeen(k){try{return parseFloat(localStorage.getItem(seenKey(k))||"0")}catch(e){return seen[k]||0}}
function setSeen(k,t){seen[k]=t;try{localStorage.setItem(seenKey(k),String(t))}catch(e){}}
function newInspections(k){var t=Math.max(getSeen(k),seen[k]||0);return reports(k).filter(function(r){return r.inspected_ts&&r.inspected_ts>t}).reverse()}

var PACK=null;
function packCfg(){return S&&S.packing_game}
function packProfiles(c){return (c&&c.profiles)||[]}
function packProfile(c){return packProfiles(c).find(function(x){return x.id===PACK.profile})||packProfiles(c)[0]||{piles:[],final_checks:[]}}
function packItems(p){var a=[];(p.piles||[]).forEach(function(g){(g.items||[]).forEach(function(x){a.push(Object.assign({pile:g.id,pile_name:g.title},x))})});return a}
function packFresh(c,profile){return {version:c.version,profile:profile||(c.default_profile||((c.profiles||[])[0]||{}).id),phase:"layout",ready:{},checked:{},packed:{},finals:{}}}
function packLoad(){var c=packCfg(),raw=null;try{raw=JSON.parse(localStorage.getItem("packing_game_test_v2")||"null")}catch(e){}PACK=raw&&raw.version===c.version?raw:packFresh(c);PACK.ready=PACK.ready||{};PACK.checked=PACK.checked||{};PACK.packed=PACK.packed||{};PACK.finals=PACK.finals||{};return PACK}
function packSave(){try{localStorage.setItem("packing_game_test_v2",JSON.stringify(PACK))}catch(e){}}
function packStageN(){return {layout:0,inspect:1,pack:2,final:3,complete:4}[PACK.phase]||0}
function packProgress(p){var items=packItems(p),fin=p.final_checks||[],den=Math.max(1,items.length*3+fin.length),n=0;items.forEach(function(x){if(PACK.ready[x.id]||PACK.checked[x.id]==="pass")n++;if(PACK.checked[x.id]==="pass")n++;if(PACK.packed[x.id])n++});fin.forEach(function(x){if(PACK.finals[x.id]==="pass")n++});return Math.min(100,Math.round(n*100/den))}
function packOpen(){var c=packCfg();if(!c)return;packLoad();$("pick").classList.remove("on");$("kid").classList.remove("on");$("packing").classList.add("on");$("packtitle").textContent=c.title||"Packing inspection";packRender();poke()}

function packSteps(){var at=packStageN(),labs=["Lay it out","Grown-up checks","Pack + zip","Final check"];return '<div class="packsteps">'+labs.map(function(x,i){return '<span class="packstep '+(i<at?'done':i===at?'on':'')+'">'+(i<at?E("2705")+' ':'')+(i+1)+'. '+x+'</span>'}).join("")+'</div>'}
function packCommon(c,p){var pts=+p.points||0,pct=packProgress(p);$("packscore").innerHTML=pts?(PACK.phase==="complete"?pts+" "+E("2b50")+" finished":pts+" "+E("2b50")+" at finish"):"grown-up list";return '<div class="packhero"><div class="ph">'+E(p.icon||c.icon||"1f9f3")+'</div><h2>'+safeText(p.name||c.subtitle||"Packing inspection")+'</h2><div class="packnote">'+safeText(p.floor?"Lay everything out on the "+p.floor+". Nothing goes into a bag until inspection passes.":c.subtitle||"")+'</div><div class="packbar"><div style="width:'+pct+'%"></div></div></div>'+
    '<div class="packpreview">'+E("1f9ea")+' Preview mode: this fake run changes no real chores or points.</div>'+
    (packProfiles(c).length>1?'<div class="packprofiles">'+packProfiles(c).map(function(x){return '<div class="packprofile '+(x.id===p.id?'on':'')+'" data-pprofile="'+safeText(x.id)+'">'+E(x.icon)+' '+safeText(x.name)+'</div>'}).join("")+'</div>':'')+
    '<div class="packrule"><b>One packer at a time.</b> Make separate piles for each bag. The grown-up checks every line for the right count, clean, fits, and right for the weather.</div>'+packSteps()}
function packPiles(p,mode){return '<div class="packpiles">'+(p.piles||[]).map(function(g){return '<div class="packpile"><h3>'+E(g.icon)+' '+safeText(g.title)+'</h3><div class="packnote">'+safeText(g.note||"")+'</div>'+(g.items||[]).map(function(x){var pass=PACK.checked[x.id]==="pass",fix=PACK.checked[x.id]==="fix",on=mode==="pack"?!!PACK.packed[x.id]:(pass||!!PACK.ready[x.id]),tap=mode==="pack"?' data-ppacked="'+safeText(x.id)+'"':(!pass?' data-playout="'+safeText(x.id)+'"':'');return '<div class="packline '+(on?'on ':'')+(fix?'fix':'')+'"'+tap+'><span class="pi">'+E(on&&!fix?"2705":x.icon||g.icon)+'</span><span class="pl">'+safeText(x.name)+(x.note?'<span class="ps">'+safeText(x.note)+'</span>':'')+'</span>'+(pass?'<span class="tag clean">checked</span>':fix?'<span class="tag warn">fix this</span>':'')+'</div>'}).join("")+'</div>'}).join("")+'</div>'}
function packAllReady(p){return packItems(p).every(function(x){return PACK.checked[x.id]==="pass"||PACK.ready[x.id]})}

function packRender(){var c=packCfg();if(!c||!PACK)return;var p=packProfile(c),h=packCommon(c,p),items=packItems(p),fixes=items.filter(function(x){return PACK.checked[x.id]==="fix"});

  }else if(PACK.phase==="inspect"){

  }else if(PACK.phase==="pack"){
    var finalFix=(p.final_checks||[]).filter(function(x){return PACK.finals[x.id]==="fix"});h+=(finalFix.length?'<div class="packwarn">'+E("1f527")+' The final check found something to fix: '+finalFix.map(function(x){return safeText(x.name)}).join(' · ')+'</div>':'')+'<div class="packstage"><h2>'+E("1f9f3")+' Inspection passed — now pack it</h2><div class="packnote">Keep each item in its inspected bag pile. Tap as it goes into the bag. Zip every bag when the list is complete.</div></div>'+packPiles(p,"pack")+'<div class="packaction"><div class="btn yes" id="packzip" style="opacity:'+(packAllPacked(p)?1:.35)+'">'+E("1f510")+' '+(finalFix.length?'Fixed and zipped again':'Everything packed and zipped')+'</div></div>';
  }else if(PACK.phase==="final"){
    var f=packNextFinal(p);if(!f){PACK.phase="complete";packSave();packRender();return}h+='<div class="packinspectitem"><div class="big">'+E(f.icon||"1f50d")+'</div><h2>'+safeText(f.name)+'</h2><div class="packnote">'+safeText(f.note||"The grown-up checks this before the packing job is complete.")+'</div><div class="packaction"><div class="btn" id="packfinalfix">'+E("1f527")+' Fix it</div><div class="btn yes" id="packfinalpass">'+E("2705")+' This passes</div></div></div>';
  }else h+='<div class="packdone"><div class="pf">'+E("1f389")+E(c.icon||"1f682")+E("1f389")+'</div><h2>Packing inspection complete</h2><div>'+safeText(p.complete_message||"Everything is ready for the journey.")+'</div>'+(+p.points?'<div style="font-size:31px;font-weight:900;margin-top:10px">'+p.points+' '+E("2b50")+' after the real grown-up inspection</div>':'<div class="packnote" style="font-size:17px;margin-top:8px">Grown-up packing does not earn kid points.</div>')+'<div class="packpreview">This preview awarded nothing.</div></div>';
  $("packbody").innerHTML=h;
  document.querySelectorAll("[data-pprofile]").forEach(function(n){n.onclick=function(){if(n.dataset.pprofile===PACK.profile)return;if(!confirm("Switch packing lists? This resets the preview for the other packer."))return;PACK=packFresh(c,n.dataset.pprofile);packSave();packRender()}});

function awardDifficulty(a){var id=a.id||"",n=parseInt((id.match(/:(\d+)$/)||[])[1]||"0",10);
