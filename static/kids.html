<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Chores</title>
<style>
:root{--kid:#888;--bg1:#fff7e6;--bg2:#e8f4ff;--ink:#2b2d42;--card:#ffffff;--gold:#ffc83d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;font-family:"Nunito","Baloo 2","Comic Sans MS",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2))}
img.e{width:1em;height:1em;vertical-align:-0.12em;display:inline-block}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:16px}
.screen.on{display:flex}
/* ---------- picker ---------- */
#pick h1{text-align:center;margin:4px 0 12px;font-size:44px;letter-spacing:1px}
#pick .row{flex:1;display:flex;gap:18px;align-items:stretch;justify-content:center}
.kidcard{flex:1;max-width:380px;border-radius:36px;background:var(--c);color:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 0 rgba(0,0,0,.18),0 18px 40px rgba(0,0,0,.18);
  transition:transform .12s;position:relative;overflow:hidden}
.kidcard:active{transform:scale(.95)}
@keyframes attnb{50%{filter:brightness(1.5);box-shadow:0 0 0 12px #ffeb3b}}
.kidcard.attn{animation:attnb .7s infinite}
.kidcard .face{font-size:150px}
.kidcard:nth-child(2) .face{animation-delay:.4s}.kidcard:nth-child(3) .face{animation-delay:.8s}
.kidcard .nm{font-size:40px;font-weight:900}
.kidcard .pts{font-size:34px;font-weight:900;background:rgba(255,255,255,.25);padding:4px 18px;border-radius:30px}
.kidcard.adult{flex:.6;max-width:220px}.kidcard.adult .face{font-size:96px}.kidcard.adult .nm{font-size:32px}
.kidcard .trophy{position:absolute;top:10px;left:14px;font-size:58px;display:flex;gap:4px}
.tr{display:inline-block;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3))}
.tr.silver img{filter:grayscale(1) brightness(1.35) contrast(1.1)}
.kidcard .act{margin-top:10px;width:88%;display:flex;flex-direction:column;gap:6px}
.kidcard .al{background:rgba(255,255,255,.22);border-radius:16px;padding:4px 12px;font-size:24px;font-weight:900;line-height:1.25;text-align:center}
.kidcard .al .cbar{margin-top:4px;background:rgba(0,0,0,.25)}.kidcard .al .cfill{background:#fff}.kidcard .al img.e{width:1.1em;height:1.1em;vertical-align:-0.15em}
.kidcard .badge{position:absolute;top:14px;right:16px;font-size:30px}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
/* ---------- kid screen ---------- */
#kid{padding:12px 14px}
.top{display:flex;align-items:center;gap:12px}
.homebtn{font-size:46px;background:#fff;border-radius:22px;padding:4px 12px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.homebtn:active{transform:scale(.92)}
.who{display:flex;align-items:center;gap:8px;font-size:40px;font-weight:900;color:var(--kid)}
.who .face{font-size:58px}
.bal{margin-left:auto;font-size:46px;font-weight:900;background:var(--kid);color:#fff;border-radius:26px;padding:2px 20px;
  box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .3s}
.bal.pop{animation:balpop .6s}
@keyframes balpop{40%{transform:scale(1.35) rotate(-4deg)}}
/* progress bar */
.goalrow{display:flex;align-items:center;gap:12px;margin:14px 6px 4px 10px}
.barwrap{position:relative;flex:1;height:46px}
.goalbtn{min-width:110px;background:#fff;border-radius:24px;padding:4px 12px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12);border:4px solid var(--kid);line-height:1}
.goalbtn:active{transform:scale(.92)}.goalbtn .gi{font-size:52px}.goalbtn .gc{font-size:20px;font-weight:900}
.goalbtn .gt{font-size:13px;font-weight:800;opacity:.6}
.bar{position:absolute;inset:0;border-radius:30px;background:#fff;box-shadow:inset 0 4px 8px rgba(0,0,0,.12);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:30px;background:var(--kid);transition:width 1.4s cubic-bezier(.2,1.4,.4,1)}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 60%)}
@keyframes shine{from{background-position:150% 0}to{background-position:-50% 0}}
.pend{position:absolute;top:0;bottom:0;width:0;border-radius:30px;opacity:.55;transition:all 1.2s;
  background:repeating-linear-gradient(45deg,var(--kid) 0 12px,#fff 12px 24px);background-size:34px 34px}
@keyframes stripes{to{background-position:34px 0}}
.mark{position:absolute;top:-30px;transform:translateX(-50%);font-size:38px;text-align:center;line-height:1}
.mark.got{animation:pulse 1s infinite;filter:drop-shadow(0 0 8px gold)}
.mark .tick{display:block;width:4px;height:52px;background:rgba(0,0,0,.15);margin:2px auto 0}
.barlbl{text-align:center;font-size:22px;font-weight:800;min-height:28px;color:#555}
/* body */
.body{flex:1;display:flex;gap:14px;min-height:0;margin-top:6px}
.chorewrap{flex:2.2;display:flex;flex-direction:column;min-height:0}
.chores{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:12px;padding:6px 4px;overflow:hidden}
.chores.two{grid-template-rows:repeat(2,1fr)}
.pager{display:flex;align-items:center;justify-content:center;gap:18px;padding:6px 0}
.pg{font-size:44px;background:#fff;border-radius:22px;padding:0 34px;box-shadow:0 5px 0 rgba(0,0,0,.12);color:var(--kid)}
.pg:active{transform:scale(.9)}.pg.off{opacity:.2}
#pgdots span{display:inline-block;width:18px;height:18px;border-radius:50%;background:#ccc;margin:0 5px}#pgdots span.on{background:var(--kid)}
.tile{background:var(--card);border-radius:26px;padding:10px 4px 8px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.10);
  transition:transform .12s;position:relative;border:4px solid transparent}
.tile:active{transform:scale(.92)}
.tile .ic{font-size:60px;line-height:1.05}
.tile .tn{font-size:16px;font-weight:800;line-height:1.1;min-height:36px;display:flex;align-items:center;justify-content:center}
.tile .st{font-size:20px;letter-spacing:-2px}
.tile.waiting{border-color:var(--kid)}
.tile.clean{opacity:.45;filter:grayscale(.7)}
.tile.taken{opacity:.6}
.tile .cb{position:absolute;top:-8px;left:-4px;font-size:30px}
.tile.cheaper{border-color:#64b5f6}
.tile.bonus{border-color:#ff9800;box-shadow:0 0 0 3px #ffc83d,0 0 18px #ff9800}
.tile.waiting::before{content:"🔍";position:absolute;top:-6px;right:-4px;font-size:30px;animation:pulse 1.2s infinite}
.side{flex:1;display:flex;flex-direction:column;gap:8px;min-width:260px;overflow:hidden}
.panel{background:rgba(255,255,255,.75);border-radius:26px;padding:10px 12px}
.panel h2{margin:0 0 6px;font-size:26px;display:flex;align-items:center;gap:6px}
.rw{display:flex;align-items:center;gap:10px;padding:8px;border-radius:20px;margin:4px 0;background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.08);position:relative}
.rw:active{transform:scale(.95)}
.rw .ic{font-size:40px}
.rw .ring{margin-left:auto;font-size:22px;font-weight:900;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;
  background:conic-gradient(var(--kid) calc(var(--p)*1%),#e6e6e6 0)}
.rw .ring span{background:#fff;border-radius:50%;width:50px;height:50px;display:grid;place-items:center}
.rw.can{box-shadow:0 0 0 3px var(--kid)}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-4deg)}90%{transform:rotate(4deg)}95%{transform:rotate(-2deg)}}
.hist{display:flex;flex-direction:column;gap:6px}
.h{display:flex;align-items:center;gap:8px;background:#fff;border-radius:18px;padding:4px 10px;font-size:20px;font-weight:800}
.h{cursor:pointer}.h:active{transform:scale(.96)}
.h .ic{font-size:38px}.h .s{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:26px}
.h .s.wait{animation:pulse 1.3s infinite}
/* modal */
.modal{position:absolute;inset:0;background:rgba(20,20,40,.55);display:none;align-items:center;justify-content:center;z-index:60}
.modal.on{display:flex}
.mx{position:absolute;top:-30px;right:-30px;width:72px;height:72px;border-radius:50%;background:#fff;color:#333;font:900 58px/66px system-ui,sans-serif;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 0 4px #333}
.mx:active{transform:scale(.9)}
.box{position:relative;background:#fff;border-radius:40px;padding:22px 30px;text-align:center;min-width:60%;max-width:92%;animation:boxin .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes boxin{from{transform:scale(.4);opacity:0}}
.box .big{font-size:130px;line-height:1.1}
.box .q{font-size:34px;font-weight:900;margin:4px 0 12px}
.faces{display:flex;gap:22px;justify-content:center}
.faces div,.btn{font-size:84px;background:#f3f3f3;border-radius:30px;padding:6px 18px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.faces div:active,.btn:active{transform:scale(.9)}
.btn.yes{background:#c8f7c5}.btn.no{background:#ffd6d6}
.done{font-size:46px;font-weight:900;color:#2e7d32;background:#e8f5e9;border-radius:30px;padding:4px 24px;display:inline-block;margin:0 0 14px}
.lbl{display:block;font-size:30px;font-weight:900;line-height:1.1;margin-top:2px;letter-spacing:.5px}
#news.bignews{background:repeating-linear-gradient(-45deg,#ffeb3b 0 40px,#ffd600 40px 80px)!important}
#news.bignews .ticker{display:inline-block;background:#d50000;color:#fff;padding:6px 40px;border-radius:24px;font-size:84px;letter-spacing:3px;
  box-shadow:0 8px 0 #7f0000;animation:flash .5s steps(2) infinite,boxin .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes flash{50%{background:#ff6d00}}
.newscard{background:#fff;border-radius:34px;padding:18px 26px;width:340px;box-shadow:0 10px 0 rgba(0,0,0,.18);animation:boxin .7s cubic-bezier(.2,1.6,.4,1);border:6px solid #d50000}
.annwho{margin-top:8px;font-size:22px;font-weight:900;background:#fff3c4;border-radius:14px;padding:4px 8px;animation:hop 3.2s infinite}
.newsprice{font-size:72px;font-weight:900;color:#d50000;animation:pulse .9s infinite}
.newscard.calm{border-color:#64b5f6}.newscard.calm .newsprice{color:#1e88e5;animation:none}
.swapcard{background:#fff;border-radius:20px;padding:6px 10px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.swaprow{display:flex;align-items:center;justify-content:space-between;font-size:38px}.swaprow b{font-size:26px;letter-spacing:2px}
.swapnote{font-size:18px;font-weight:900;text-align:center}
.toygrid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:10px 0}
.toyb{font-size:64px;background:#f3f3f3;border-radius:24px;padding:8px 16px;min-width:130px;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.toyb .lbl{font-size:22px}
.ktext{font-size:46px;font-weight:900;min-height:64px;background:#f3f3f3;border-radius:18px;padding:4px 16px;margin:4px 0 10px;letter-spacing:2px;text-align:left}
.caret{animation:pulse 1s infinite;color:var(--kid)}
.kbd{display:flex;flex-direction:column;gap:8px;align-items:center}
.krow{display:flex;gap:8px}
.key{width:76px;height:70px;border-radius:16px;background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18),inset 0 0 0 3px #ddd;font:900 38px/70px system-ui,sans-serif;text-align:center}
.key:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18),inset 0 0 0 3px var(--kid)}
.key.wide{width:120px}.key.space{width:360px;font-size:26px}.key.ok{width:220px;font-size:30px;background:#c8f7c5}
.rw.cool{background:#f1f1f1}
.cbar{height:12px;background:#ddd;border-radius:8px;overflow:hidden;margin-top:5px}
.cfill{height:100%;width:0;background:var(--kid);border-radius:8px}
.cfill.drain{background:#43a047}.cfill.wait{background:#90a4ae}
.doing{display:flex;align-items:center;gap:12px;background:#fff3c4;border:4px solid #f5b400;border-radius:24px;padding:6px 14px;margin:4px 6px;font-size:26px;font-weight:900}
.doing .ic{font-size:48px}.doing .t{font-variant-numeric:tabular-nums;color:#b26a00}
.doing .btn{font-size:22px;padding:6px 12px;margin-left:4px}.doing .tmi{font-size:30px}
.tile .dz{position:absolute;bottom:-6px;right:-4px;font-size:26px;background:#fff3c4;border-radius:12px;padding:0 4px}
.newsbtn{font-size:40px;background:#fff;border-radius:22px;padding:0 12px;box-shadow:0 5px 0 rgba(0,0,0,.12);margin-left:auto}
.streak{font-size:34px;background:#fff;border-radius:22px;padding:0 12px;box-shadow:0 5px 0 rgba(0,0,0,.12);font-weight:900;display:flex;align-items:center;gap:6px}
.streak.cold{filter:grayscale(1);opacity:.6}.streak .sk2{font-size:16px;color:#e65100;max-width:90px;line-height:1}
.streak.atrisk{animation:pulse 1.6s infinite;border:3px solid #ff9800}
.awbtn{font-size:40px;background:#fff;border-radius:22px;padding:0 14px;box-shadow:0 5px 0 rgba(0,0,0,.12);font-weight:900}
.awbtn .n{font-size:24px;vertical-align:middle}
.awtabs{display:inline-flex;gap:10px;margin-left:24px;vertical-align:middle}
.awtab{font-size:46px;background:rgba(255,255,255,.15);border-radius:20px;padding:0 10px;border:4px solid transparent}
.awtab.on{border-color:var(--c);background:rgba(255,255,255,.35)}
.wincard{background:rgba(255,255,255,.14);border-radius:18px;padding:8px 12px;margin-bottom:10px}
.wincard .wt{font-size:22px;font-weight:900;margin-bottom:4px}
.vs{display:flex;align-items:center;gap:8px;font-size:30px;margin:3px 0}.vs b{font-size:20px;min-width:70px}
.vsb{flex:1;height:18px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden}.vsb div{height:100%;border-radius:10px}
.tip{font-size:19px;font-weight:700;margin-top:4px}
.awpg{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:8px;font-size:22px;font-weight:900}
.pg2{font-size:36px;background:rgba(255,255,255,.2);border-radius:18px;padding:0 22px}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.af{border-radius:16px;padding:6px 8px;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.2);position:relative}
.af .ai{font-size:34px;float:left;margin-right:6px}.af .an{font-size:15px;font-weight:900}.af .al{font-size:13px;font-weight:900;opacity:.9}
.af .ab{clear:both;height:8px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden;margin-top:4px}.af .ab div{height:100%;background:#ffd54a}
.af .as{font-size:12px;opacity:.85;margin-top:2px}
.af.bronze{border-color:#cd7f32;background:linear-gradient(135deg,rgba(205,127,50,.35),rgba(255,255,255,.08))}
.af.silver{border-color:#cfd8dc;background:linear-gradient(135deg,rgba(207,216,220,.4),rgba(255,255,255,.08))}
.af.gold{border-color:#ffd54a;background:linear-gradient(135deg,rgba(255,213,74,.45),rgba(255,255,255,.08))}
.af.diamond{border-color:#80deea;background:linear-gradient(135deg,rgba(128,222,234,.5),rgba(255,255,255,.12))}
.af.locked{filter:grayscale(1);opacity:.55}
.af.near{box-shadow:0 0 0 3px #ff9800,0 0 18px #ff9800}
.awcol{flex:1;background:rgba(255,255,255,.08);border-radius:26px;padding:10px 12px;overflow:hidden}
.awcol h3{margin:0 0 8px;font-size:26px}
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.aw{background:rgba(255,255,255,.14);border-radius:20px;padding:8px;text-align:center}
.aw .i{font-size:54px;line-height:1.1}.aw .t{font-size:16px;font-weight:900;line-height:1.15}.aw .s{font-size:13px;opacity:.8}
.aw.lock{opacity:.4;filter:grayscale(1)}
.rec{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:16px;padding:6px 10px;margin:6px 0;font-size:20px;font-weight:800}
.rec{cursor:pointer}.rec:active{transform:scale(.97)}
.rec .i{font-size:36px}.rec .tm{margin-left:auto;font-variant-numeric:tabular-nums}
.race{position:relative;flex:1;height:34px;background:#fff;border-radius:18px;box-shadow:inset 0 3px 6px rgba(0,0,0,.15);overflow:visible;min-width:220px}
.race .rf{position:absolute;left:0;top:0;bottom:0;border-radius:18px;background:linear-gradient(90deg,#ffd54a,#43a047)}
.race.over .rf{background:#ff9800}
.race .runner{position:absolute;top:-14px;font-size:40px;transform:translateX(-50%)}
.race .flag{position:absolute;top:-34px;font-size:26px;transform:translateX(-50%);white-space:nowrap;text-align:center;z-index:2}
.race .flag .fl{display:block;font-size:14px;font-weight:900;color:#b26a00;background:#fff;border-radius:8px;padding:0 4px;margin-top:-4px}
.race .usual{position:absolute;top:0;bottom:0;width:3px;background:rgba(0,0,0,.35)}
.race .usual span{position:absolute;top:36px;left:50%;transform:translateX(-50%);font-size:13px;font-weight:800;white-space:nowrap;color:#666}
.race .lbl2{position:absolute;right:8px;top:4px;font-size:18px;font-weight:900;color:#555}
.ktag{position:absolute;right:-6px;bottom:-8px;background:#fff;border-radius:14px;padding:1px 6px;font-size:26px;box-shadow:0 3px 0 rgba(0,0,0,.15);line-height:1.1}
.ktag.doing{background:#fff3c4;animation:hop 3.2s infinite}
@keyframes hop{0%,82%,100%{transform:translateY(0)}86%{transform:translateY(-12px)}90%{transform:translateY(0)}94%{transform:translateY(-6px)}}
.kbar{height:6px;width:52px;background:#e0e0e0;border-radius:4px;overflow:hidden;margin:1px auto 2px}.kbar .tb{height:100%;width:0;background:#43a047}
.tile.clean{opacity:.55}
.pbar{position:relative;height:22px;background:#e9ecef;border-radius:12px;margin:34px 6px 22px;min-width:200px}
.pbar.big{height:34px;margin:36px 8px 24px;flex:1}
.pbar .pf{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:12px;background:linear-gradient(90deg,#ffd54a,#43a047)}
.pbar.over .pf{background:#ff9800}
.pbar .pm{position:absolute;top:-30px;transform:translateX(-50%);font-size:20px;white-space:nowrap;text-align:center;line-height:1}
.pbar .pm span{display:block;font-size:12px;font-weight:800;color:#555}
.pbar .pm::after{content:"";position:absolute;left:50%;top:26px;width:2px;height:26px;background:rgba(0,0,0,.3)}
.pbar.big .pm::after{height:38px}
.pbar .pm.pb{top:auto;bottom:-34px}.pbar .pm.pb::after{top:auto;bottom:22px}
.pbar .pr{position:absolute;top:-4px;font-size:26px;transform:translateX(-50%);left:0}
.pbar.big .pr{font-size:36px;top:-6px}
#tmrchip{position:fixed;top:10px;right:14px;z-index:46;background:#101830;color:#fff;border-radius:22px;padding:4px 14px;font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
#tmrchip .ct{font-variant-numeric:tabular-nums}
.pgrid{display:grid;grid-template-columns:repeat(5,90px);gap:10px;justify-content:center;margin:10px 0}
.pp{font-size:56px;background:#f3f3f3;border-radius:20px;position:relative;padding:4px}
.pp span{position:absolute;bottom:0;right:6px;font-size:22px;font-weight:900}
.pp.hot{background:#ffe082;transform:scale(1.12)}.pp.win{background:#ff4f9a;box-shadow:0 0 0 5px #d50000}
.donefaces div{position:relative;background:#e8f5e9;border:5px solid #43a047}
.donefaces .chk{position:absolute;top:-22px;right:-22px;font-size:52px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.x{margin-top:16px;font-size:44px;opacity:.7}
.celebrate .big{font-size:150px;animation:spin .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes spin{from{transform:scale(0) rotate(-200deg)}}
.plus{font-size:64px;font-weight:900;color:var(--kid)}
canvas#fx{position:absolute;inset:0;pointer-events:none;z-index:30}
.fly{position:absolute;z-index:31;font-size:60px;font-weight:900;pointer-events:none;transition:all 1.1s cubic-bezier(.5,-0.4,.6,1)}
@media (max-width:700px){
  .body{flex-direction:column}.side{min-width:0}
  .kidcard .face{font-size:96px}#pick .row{flex-direction:column}
  .chores{grid-template-columns:repeat(3,1fr)}
}
html.locked #exit,html.locked #home,html.locked #bedadult,html.locked #adult{display:none!important}
</style></head>
<body>

        return '<div class="toyb" data-w="'+k.id+'" style="'+(sel[k.id]?"border:6px solid "+k.color+";background:#fff":"")+(why?";opacity:.45":"")+'">'+E(k.icon)+'<span class="lbl">'+k.name+(sel[k.id]?" "+E("2705"):"")+(why?'<br><span style="font-size:18px">'+why+'</span>':'')+'</span></div>'}).join("")+'</div>'+
      '<div class="q" style="font-size:24px">'+[kid].concat(Object.keys(sel)).map(function(m){return E(KI2(m).icon)+' '+r.cost+E("2b50")}).join(" &nbsp; ")+'</div>'+
      '<div class="faces"><div class="btn yes" id="wgo" style="font-size:36px;font-weight:900;padding:12px 26px'+(Object.keys(sel).length?'':';opacity:.4')+'">'+E("25b6")+' Watch together</div></div>');

function buy(r,tv,withKids){L("buy",{reward:r.id,tv:tv,with:withKids||[]});{if(busy)return;busy=true;api("/api/spend",{kid:kid,reward:r.id,tv:tv,"with":withKids||[]}).then(function(res){busy=false;
    if(!res.ok){modal('<div class="big">'+E("1f6ab")+'</div><div class="q">'+(res.error||"Can't buy that")+'</div>');addOk();return}S=res.state;boughtHere[res.event.id]=1;
    var tog=(withKids||[]).length?'<div class="q" style="font-size:28px">'+E("1f465")+' '+[kid].concat(withKids).map(function(m){return E(KI2(m).icon)+' '+KI2(m).name}).join(" + ")+'</div>':'';
    var q=res.event.queued?'<div class="q" style="font-size:26px;background:#fff8e1;border-radius:16px;padding:6px 12px">'+E("23f3")+' Your time starts when the show before yours ends.</div>':'';
    modal('<div class="celebrate"><div class="big">'+E(r.icon)+'</div><div class="q">'+E("1f973")+' '+r.name+'! '+E("1f973")+'</div>'+tog+q+(r.minutes?'<div class="q" style="font-size:30px">'+E("23f1")+' '+r.minutes+' minutes. Then a '+r.break_min+' minute break.</div>':'')+'</div>');
    confetti(260);chime([523,784,1047,1319,1047,1319,1568]);addOk(function(){renderKid();syncTimers()})}).catch(function(){busy=false})}
}

/* --- modal / idle --- */

  if(!$("m").classList.contains("on")||$("okbtn"))return;
  $("mbox").insertAdjacentHTML("beforeend",'<div class="faces" style="margin-top:14px"><div class="btn yes" id="okbtn" style="font-size:44px;font-weight:900;padding:10px 44px">OK</div></div>');
  $("okbtn").onclick=function(e){e.stopPropagation();closeModal();if(after)after()}}
function modal(h){$("mbox").innerHTML='<div class="mx" id="mx" aria-label="Close">&times;</div>'+h;$("mx").onclick=function(e){e.stopPropagation();closeModal()};$("m").classList.add("on");poke()}
function closeModal(){L("close_modal");inspModalRef=null;(S&&S.config?S.config.chores:[]).forEach(function(c){delete c._note});$("m").classList.remove("on")}
function goHome(why){if(LOCKED){$("awards").classList.remove("on");closeModal();render();return}   // a locked (one-child) screen never leaves that child
  L("go_home",{why:typeof why==="string"?why:"tap"});$("awards").classList.remove("on");if(kid)setSeen(kid,S?S.now:0);kid=null;closeModal();$("kid").classList.remove("on");$("pick").classList.add("on");render()}

$("exit").onclick=function(){L("hub_exit");$("exit").style.background="#ffe082";$("exit").innerHTML=E("1f44b")+" Bye!";api("/api/exit",{})};
var IDLE_MS=300000; // back to "Who are you?" after 5 min untouched
function poke(){clearTimeout(idleT);idleT=setTimeout(function(){if($("timer").classList.contains("on")&&!tmrHidden[(tmrCur||"").split(":")[0]])return poke();
  $("news").classList.remove("on");goHome("idle")},IDLE_MS)}
document.addEventListener("touchstart",poke,{passive:true});document.addEventListener("mousedown",poke);document.addEventListener("click",poke,true);

/* --- effects --- */
var cv=$("fx"),cx=cv.getContext("2d"),parts=[],raf=null;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener("resize",size);
var MAXP=30;
function confetti(n){n=Math.min(n,MAXP-parts.length);if(n<=0)return;var col=[getComputedStyle(document.documentElement).getPropertyValue("--kid")||"#f44","#ffc83d","#ff5fa2","#4dd0e1","#7c4dff","#69f0ae"];
  for(var i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*0.45,vx:(Math.random()-.5)*26,vy:-Math.random()*24-6,r:Math.random()*8+5,c:col[i%col.length],a:Math.random()*6,va:(Math.random()-.5)*.4,life:70+Math.random()*30,star:false});
  if(!raf)tick()}
function tick(){cx.clearRect(0,0,cv.width,cv.height);parts=parts.filter(function(p){return p.life-->0&&p.y<cv.height+40});
  parts.forEach(function(p){p.vy+=.55;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;
    cx.fillRect(-p.r,-p.r/2,p.r*2,p.r)
    ;cx.restore()});
  raf=parts.length?requestAnimationFrame(tick):(cx.clearRect(0,0,cv.width,cv.height),null)}
var AC=null;function chime(notes){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var t=AC.currentTime;
  notes.forEach(function(f,i){var o=AC.createOscillator(),g=AC.createGain();o.type="triangle";o.frequency.value=f;o.connect(g);g.connect(AC.destination);
    g.gain.setValueAtTime(0,t+i*.11);g.gain.linearRampToValueAtTime(.18,t+i*.11+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.11+.45);o.start(t+i*.11);o.stop(t+i*.11+.5)})}catch(e){}}
function wobble(){var b=$("kbal");b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop")}

var VER=null;

  $("news").classList.toggle("bignews",anyUp);

  var card=function(a){var c=S.config.chores.find(function(x){return x.id===a.chore})||{name:a.chore,icon:"2b50"};
    var up=a.base!=null&&a.price!=null&&a.price>a.base,down=a.base!=null&&a.price!=null&&a.price<a.base;
    return '<div class="newscard'+(down?' calm':'')+'"><div style="font-size:120px;line-height:1.05">'+E(c.icon)+'</div>'+
      '<div style="font-size:38px;font-weight:900">'+c.name+'</div><div class="newsprice">'+(a.base!=null&&a.price!==a.base?'<s style="opacity:.45;font-size:44px">'+a.base+'</s> ':'')+(a.price==null?"?":a.price)+' '+E("2b50")+'</div>'+
      '<div style="font-size:19px;font-weight:700">'+(up?"Extra messy! It is worth more this time.":down?"Almost clean! It is worth less this time.":"New price, just this one time.")+'</div>'+
      (function(){var KI=function(k){return S.config.kids.find(function(x){return x.id===k})||{icon:"2753",name:k}};
        var doers=Object.keys(S.active||{}).filter(function(k){return S.active[k].chore===a.chore}),bd=S.board[a.chore]||{};
        if(doers.length)return '<div class="annwho">'+doers.map(function(k){return E(KI(k).icon)+" "+KI(k).name}).join(", ")+' is doing it now!</div>';
        if(bd.pending_by&&bd.pending_by.length)return '<div class="annwho">'+E("1f50d")+" "+bd.pending_by.map(function(k){return E(KI(k).icon)+" "+KI(k).name}).join(", ")+' already did it</div>';

  // too many at once pushed OK off the Hub screen -> 3 per page, "Next" until the last page

    $("newsok").innerHTML=pg<pages-1?'Next '+E("25b6")+' <span style="font-size:30px;opacity:.75">'+(pg+1)+'/'+pages+'</span>':(pages>1?'OK <span style="font-size:30px;opacity:.75">'+pages+'/'+pages+'</span>':'OK')};
  drawN();
  if(anyUp){chime([110,130,150,170]);setTimeout(function(){chime([523,659,784,1047,1319]);confetti(70)},500)}else chime([523,440]);
  L("announce",{ids:list.map(function(a){return a.id})});
  $("newsok").onclick=function(e){e.stopPropagation();if(pg<pages-1){pg++;drawN();chime([523,659]);L("announce_next",{page:pg});return}$("news").classList.remove("on");var ids=list.map(function(a){return a.id});
    if(kid){S.ann_seen_kids=S.ann_seen_kids||{};S.ann_seen_kids[kid]=((S.ann_seen_kids[kid])||[]).concat(ids)}
    api("/api/ann_seen",{ids:ids,kid:kid});L("announce_ok",{ids:ids});if(done)done()};
}

document.addEventListener("click",function(e){
  if(!S||$("news").classList.contains("on")||e.target.closest("#exit"))return;

load().then(function(){VER=S.version;var q=(location.search.match(/[?&]kid=([a-z]+)/)||[])[1];if(q&&S.config.kids.some(function(k){return k.id===q}))openKid(q)});setInterval(function(){if(!busy&&!$("m").classList.contains("on"))load()},5000);
